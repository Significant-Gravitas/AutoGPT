name: Temporary Ollama preflight fixer

on:
  push:
    branches: [fix-ollama-credentials]
    paths:
      - .github/workflows/temporary-fix-ollama-preflight.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/backend
    env:
      CI: true
      PLAIN_OUTPUT: True
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ollama-credentials
          fetch-depth: 0

      - name: Apply preflight validation fix and regression tests
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          utils = "autogpt_platform/backend/backend/executor/utils.py"
          replace_once(
              utils,
              '''from backend.data.rabbitmq import Exchange, ExchangeType, Queue, RabbitMQConfig\nfrom backend.util.clients import (\n''',
              '''from backend.data.rabbitmq import Exchange, ExchangeType, Queue, RabbitMQConfig\nfrom backend.executor.no_auth_credentials import get_no_auth_credentials\nfrom backend.util.clients import (\n''',
          )
          replace_once(
              utils,
              '''        credentials_fields_info = block.input_schema.get_credentials_fields_info()\n\n        for field_name, credentials_meta_type in credentials_fields.items():\n            reference_only = credentials_fields_info[\n                field_name\n            ].credential_reference_only\n''',
              '''        credentials_fields_info = block.input_schema.get_credentials_fields_info()\n        validation_input = dict(node.input_default)\n        if nodes_input_masks and (node_input_mask := nodes_input_masks.get(node.id)):\n            validation_input.update(node_input_mask)\n\n        for field_name, credentials_meta_type in credentials_fields.items():\n            field_info = credentials_fields_info[field_name]\n            if get_no_auth_credentials(field_info, validation_input) is not None:\n                # Credential-free discriminator variants are valid at preflight.\n                # The executor injects their internal runtime adapter before the\n                # block input is validated, so no user credential lookup is needed.\n                continue\n            reference_only = field_info.credential_reference_only\n''',
          )

          tests = "autogpt_platform/backend/backend/executor/utils_test.py"
          marker = '''\n\n@pytest.mark.asyncio\nasync def test_validate_graph_with_credentials_returns_nodes_to_skip(\n'''
          addition = '''\n\n@pytest.mark.asyncio\nasync def test_validate_node_input_credentials_allows_credential_free_ollama(\n    mocker: MockerFixture,\n):\n    from backend.blocks.llm import AITextGeneratorBlock, LLMModel\n    from backend.executor.utils import _validate_node_input_credentials\n    from backend.integrations.providers import ProviderName\n\n    ollama_model = next(\n        model for model in LLMModel if model.metadata.provider == ProviderName.OLLAMA\n    )\n    mock_node = mocker.MagicMock()\n    mock_node.id = "ollama-node"\n    mock_node.credentials_optional = False\n    mock_node.input_default = {"model": ollama_model.value}\n    mock_node.block = mocker.MagicMock()\n    mock_node.block.input_schema = AITextGeneratorBlock.Input\n\n    mock_graph = mocker.MagicMock()\n    mock_graph.nodes = [mock_node]\n    mock_store = mocker.patch(\n        "backend.executor.utils.get_integration_credentials_store"\n    )\n\n    errors, nodes_to_skip = await _validate_node_input_credentials(\n        graph=mock_graph,\n        user_id="test-user-id",\n        nodes_input_masks=None,\n    )\n\n    assert errors == {}\n    assert nodes_to_skip == set()\n    mock_store.assert_not_called()\n\n\n@pytest.mark.asyncio\nasync def test_validate_node_input_credentials_keeps_authenticated_provider_required(\n    mocker: MockerFixture,\n):\n    from backend.blocks.llm import AITextGeneratorBlock, LLMModel\n    from backend.executor.utils import _validate_node_input_credentials\n    from backend.integrations.providers import ProviderName\n\n    openai_model = next(\n        model for model in LLMModel if model.metadata.provider == ProviderName.OPENAI\n    )\n    mock_node = mocker.MagicMock()\n    mock_node.id = "openai-node"\n    mock_node.credentials_optional = False\n    mock_node.input_default = {"model": openai_model.value}\n    mock_node.block = mocker.MagicMock()\n    mock_node.block.input_schema = AITextGeneratorBlock.Input\n\n    mock_graph = mocker.MagicMock()\n    mock_graph.nodes = [mock_node]\n\n    errors, nodes_to_skip = await _validate_node_input_credentials(\n        graph=mock_graph,\n        user_id="test-user-id",\n        nodes_input_masks=None,\n    )\n\n    assert errors[mock_node.id]["credentials"] == CRED_ERR_REQUIRED\n    assert mock_node.id not in nodes_to_skip\n'''
          p = Path(tests)
          text = p.read_text()
          if marker not in text:
              raise SystemExit("Expected credential-test insertion point not found")
          p.write_text(text.replace(marker, addition + marker, 1))

          Path(".github/workflows/temporary-fix-ollama-preflight.yml").unlink()
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Install dependencies
        run: poetry install

      - name: Run upstream lint gate
        run: poetry run lint --skip-pyright

      - name: Generate Prisma Client and type stub
        run: poetry run prisma generate && poetry run gen-prisma-stub

      - name: Run Pyright for supported Python versions
        run: |
          poetry run pyright --pythonversion 3.11
          poetry run pyright --pythonversion 3.12
          poetry run pyright --pythonversion 3.13

      - name: Run Ollama credential regression tests
        run: |
          poetry run pytest --confcutdir=backend/executor \
            backend/executor/no_auth_credentials_test.py \
            backend/executor/utils_test.py::test_validate_node_input_credentials_allows_credential_free_ollama \
            backend/executor/utils_test.py::test_validate_node_input_credentials_keeps_authenticated_provider_required \
            -q

      - name: Verify block documentation sync
        run: poetry run python scripts/generate_block_docs.py --check

      - name: Commit validated preflight fix
        working-directory: .
        run: |
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(platform/llm): allow no-auth Ollama through preflight"
          git push origin HEAD:fix-ollama-credentials
