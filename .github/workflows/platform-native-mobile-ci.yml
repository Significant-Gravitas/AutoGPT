name: AutoGPT Platform - Native Mobile

on:
  pull_request:
    paths:
      - ".github/workflows/platform-native-mobile-ci.yml"
      - "autogpt_platform/backend/**"
      - "autogpt_platform/autogpt_libs/**"
      - "autogpt_platform/frontend/src/lib/auth/**"
      - "autogpt_platform/frontend/scripts/native-auth-server.ts"
      - "autogpt_platform/frontend/package.json"
      - "autogpt_platform/frontend/pnpm-lock.yaml"
  push:
    branches: [dev, master]
    paths:
      - ".github/workflows/platform-native-mobile-ci.yml"
      - "autogpt_platform/backend/**"
      - "autogpt_platform/autogpt_libs/**"
      - "autogpt_platform/frontend/src/lib/auth/**"
      - "autogpt_platform/frontend/scripts/native-auth-server.ts"
      - "autogpt_platform/frontend/package.json"
      - "autogpt_platform/frontend/pnpm-lock.yaml"
  merge_group:
  workflow_dispatch:
    inputs:
      cold_cache:
        type: boolean
        default: false
        description: Measure without restoring dependency caches

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-journeys:
    name: native server journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/native_mobile_test?schema=platform
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/native_mobile_test?schema=platform
      REDIS_CLUSTER_HOST: 127.0.0.1
      REDIS_CLUSTER_PORT: "17000"
      JWT_JWKS_URL: http://127.0.0.1:1/api/auth/jwks
      ENABLE_AUTH: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: native_mobile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Restore Python environment
        id: python-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v5
        with:
          path: autogpt_platform/backend/.venv
          key: native-server-python-${{ runner.os }}-3.12-${{ hashFiles('autogpt_platform/backend/poetry.lock', 'autogpt_platform/backend/pyproject.toml', 'autogpt_platform/autogpt_libs/pyproject.toml') }}

      - name: Find pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore frontend dependencies
        id: frontend-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: native-server-pnpm-${{ runner.os }}-${{ hashFiles('autogpt_platform/frontend/pnpm-lock.yaml') }}

      - name: Install locked dependencies
        shell: bash
        run: |
          poetry_version=$(python .github/workflows/scripts/get_package_version_from_lockfile.py poetry autogpt_platform/backend/poetry.lock)
          python -m pip install "poetry==$poetry_version"
          pnpm --dir autogpt_platform/frontend install --frozen-lockfile --prefer-offline &
          frontend_install_pid=$!
          poetry -C autogpt_platform/backend install &
          backend_install_pid=$!
          install_status=0
          wait "$frontend_install_pid" || install_status=1
          wait "$backend_install_pid" || install_status=1
          exit "$install_status"

      - name: Start the Redis cluster
        shell: bash
        run: |
          docker pull redis:7.4-alpine
          for port in 17000 17001 17002; do
            docker run -d --name "native-redis-$port" --network host redis:7.4-alpine \
              redis-server --port "$port" --bind 127.0.0.1 \
              --cluster-enabled yes --cluster-config-file nodes.conf --appendonly no
          done
          for port in 17000 17001 17002; do
            for redis_attempt in $(seq 1 20); do
              if docker exec "native-redis-$port" redis-cli -p "$port" ping; then break; fi
              echo "Waiting for Redis on $port (attempt $redis_attempt)"
              sleep 1
            done
            docker exec "native-redis-$port" redis-cli -p "$port" ping
          done
          docker exec native-redis-17000 redis-cli --cluster create \
            127.0.0.1:17000 127.0.0.1:17001 127.0.0.1:17002 \
            --cluster-replicas 0 --cluster-yes
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Generate and migrate
        working-directory: autogpt_platform/backend
        run: |
          poetry run prisma generate
          poetry run prisma migrate deploy

      - name: Exercise production auth and pending-message journeys
        working-directory: autogpt_platform/backend
        run: |
          poetry run pytest \
            test/native_mobile/auth_journey.py \
            test/native_mobile/auth_process_test.py \
            backend/api/features/chat/pending_retries_test.py \
            backend/copilot/pending_retries_db_test.py \
            --cov=backend --cov-report=xml:native-server-coverage.xml \
            --junitxml=native-server-results.xml -q

      - name: Record cache state and test results
        if: always()
        env:
          PYTHON_CACHE_HIT: ${{ steps.python-cache.outputs.cache-hit }}
          FRONTEND_CACHE_HIT: ${{ steps.frontend-cache.outputs.cache-hit }}
        run: |
          {
            echo 'Native server journeys use a standard ubuntu-latest runner.'
            echo "Python cache hit: ${PYTHON_CACHE_HIT:-false}"
            echo "Frontend cache hit: ${FRONTEND_CACHE_HIT:-false}"
            echo 'Use the GitHub job start/completion timestamps for the complete runtime, including setup.'
            echo 'This lane does not certify iOS build time or live identity/payment/push providers.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-server-results
          path: |
            autogpt_platform/backend/native-server-results.xml
            autogpt_platform/backend/native-server-coverage.xml
          if-no-files-found: warn

      - name: Upload server coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-native-mobile
          files: autogpt_platform/backend/native-server-coverage.xml
