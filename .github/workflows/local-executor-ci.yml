name: Local Executor - CI

# The Local PC companion (local_executor/) is a standalone package. It runs on
# users' machines, so it is tested on every OS it supports.

on:
  push:
    branches: [master, dev]
    paths:
      - ".github/workflows/local-executor-ci.yml"
      - "local_executor/**"
  pull_request:
    paths:
      - ".github/workflows/local-executor-ci.yml"
      - "local_executor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('local-executor-ci-{0}', github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('{0}-{1}', github.event_name, github.event.pull_request.number) || github.sha)) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

defaults:
  run:
    shell: bash
    working-directory: local_executor

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: local_executor/pyproject.toml

      - name: Install the package (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # cua-driver ships wheels for every OS here, and the contract tests
      # (tests/test_cua_driver_contract.py) run it for real, so this one
      # must install.
      - name: Install the computer-use extra
        run: python -m pip install -e ".[computer-use]"

      # The other extras are pure Python on every OS (pyusb looks for libusb
      # only when it runs), so each must install too, though the tests don't
      # need them; one step each says which broke. The coverage job tests the
      # core install alone.
      - name: Install the hardware extra
        run: python -m pip install -e ".[hardware]"

      - name: Install the local-llm extra
        run: python -m pip install -e ".[local-llm]"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-mock

      - name: Run pytest
        run: python -m pytest tests/ -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  coverage:
    name: coverage (ubuntu / py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local_executor/pyproject.toml

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock coverage

      - name: Run coverage
        run: |
          coverage run -m pytest tests/ -v
          coverage report -m
