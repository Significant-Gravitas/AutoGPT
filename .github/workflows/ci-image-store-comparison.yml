name: Compare direct appliance image stores
'on':
  push:
    branches:
    - codex/ci-image-store-20261119
permissions:
  contents: read
cache-mode: none
env:
  DEPLOY_IMAGE: docker.io/significantgravitas/autogpt
  BUILD_CACHE_IMAGE: ghcr.io/significant-gravitas/autogpt-single-container-buildcache
jobs:
  appliance:
    name: Appliance store (${{ matrix.platform }}, ${{ matrix.mode }}, repeat ${{ matrix.repeat }})
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
          suffix: amd64
          mode: container
          repeat: 1
        - platform: linux/amd64
          runner: ubuntu-24.04
          suffix: amd64
          mode: container
          repeat: 2
        - platform: linux/amd64
          runner: ubuntu-24.04
          suffix: amd64
          mode: direct
          repeat: 1
        - platform: linux/amd64
          runner: ubuntu-24.04
          suffix: amd64
          mode: direct
          repeat: 2
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          suffix: arm64
          mode: container
          repeat: 1
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          suffix: arm64
          mode: container
          repeat: 2
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          suffix: arm64
          mode: direct
          repeat: 1
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          suffix: arm64
          mode: direct
          repeat: 2
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/docs/platform/.gitbook/assets/*.png
          !/docs/platform/.gitbook/assets/*.gif
    - name: Verify application source and test fixtures are present
      run: python3 .github/scripts/validate_ci_checkout.py
    - name: Initialize validation reports
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
      run: |
        mkdir -p "$REPORT_DIR"
        jq -n \
          --arg sha "$GITHUB_SHA" \
          --arg platform "${{ matrix.platform }}" \
          '{sha: $sha, platform: $platform, validated: false}' \
          > "$REPORT_DIR/status.json"
    - name: Set up the candidate Docker image store
      if: matrix.mode == 'direct'
      uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
      with:
        version: v29.9.2
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      with:
        version: v0.36.0
        cleanup: false
        driver-opts: |
          image=docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
      if: matrix.mode == 'container'
    - name: Set up direct Docker builder
      if: matrix.mode == 'direct'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      with:
        version: v0.36.0
        driver: docker
        cleanup: false
    - name: Record the runner and Docker builder
      run: |-
        nproc
        lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):'
        docker version
        docker buildx version
        docker buildx inspect
        docker info --format '{{json .DriverStatus}}'
    - name: Authenticate to GHCR build cache
      continue-on-error: ${{ github.event_name == 'pull_request' }}
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure registry build cache
      id: cache
      shell: bash
      env:
        BUILD_CACHE_ARCH: ${{ matrix.suffix }}
      run: |
        python3 - <<'PY'
        import os, sys
        sys.path.insert(0, '.github/scripts')
        from single_container_cache import cache_settings
        settings = cache_settings('pull_request', '', os.environ['BUILD_CACHE_IMAGE'], os.environ['BUILD_CACHE_ARCH'], head_ref='codex/ci-throughput-20261030')
        assert not any('.cache-to=' in item for item in settings)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('set<<CACHE_EOF\n' + '\n'.join(settings) + '\nCACHE_EOF\n')
        PY
    - name: Set the daily OS package refresh
      id: apt-refresh
      shell: bash
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    - name: Test appliance runtime helpers
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
      run: python3 .github/scripts/run_unittest_junit.py --start-directory autogpt_platform/single-container/tests
        --pattern 'test_*.py' --allow-skip test_documented_operations.DocumentedOperationsTest.test_restored_launch_supports_bash_3_when_available
        --output "$REPORT_DIR/runtime-helpers.xml"
    - name: Test publication helpers
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
      run: python3 .github/scripts/run_command_junit.py --name publication-policy --classname single-container.publication
        --output "$REPORT_DIR/publication-policy.xml" -- bash .github/scripts/platform-single-container-publish.sh
        self-test
    - name: Give each Bake target a distinct source mount
      id: source-contexts
      shell: bash
      run: |
        {
          echo 'set<<CONTEXT_EOF'
          for target in backend-server-base backend-server single-container; do
            path="$RUNNER_TEMP/context-$target"
            ln -s "$GITHUB_WORKSPACE" "$path"
            [[ "$(readlink -f "$path")" == "$(readlink -f "$GITHUB_WORKSPACE")" ]]
            printf '%s.context=%s\n' "$target" "$path"
          done
          echo CONTEXT_EOF
        } >> "$GITHUB_OUTPUT"
        git diff --exit-code
    - name: Choose local image export
      id: export
      shell: bash
      env:
        IMAGE_STORE_MODE: ${{ matrix.mode }}
      run: |
        if [[ "$IMAGE_STORE_MODE" == container ]]; then
          echo 'set=single-container.output=type=docker,compression=uncompressed' >> "$GITHUB_OUTPUT"
        fi
    - name: Build image without publishing
      id: build-image
      background: true
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
      with:
        source: .
        files: autogpt_platform/single-container/docker-bake.hcl
        targets: single-container
        set: |
          *.platform=${{ matrix.platform }}
          *.args.APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          single-container.args.IMAGE_VERSION=sha-${{ github.sha }}
          single-container.args.VCS_REF=${{ github.sha }}
          ${{ steps.export.outputs.set }}
          single-container.tags=autogpt-platform-single-container:ci-${{ matrix.suffix }}
          ${{ steps.cache.outputs.set }}
          ${{ steps.source-contexts.outputs.set }}
    - name: Wait for image build
      wait: build-image
    - name: Verify image source revision
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
        SMOKE_IMAGE: autogpt-platform-single-container:ci-${{ matrix.suffix }}
      run: |
        actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$SMOKE_IMAGE")"
        if [[ "$actual_revision" != "$GITHUB_SHA" ]]; then
          echo "expected image revision $GITHUB_SHA, got $actual_revision" >&2
          exit 1
        fi
        image_id="$(docker image inspect --format '{{ .Id }}' "$SMOKE_IMAGE")"
        jq -n \
          --arg sha "$GITHUB_SHA" \
          --arg platform "${{ matrix.platform }}" \
          --arg image "$SMOKE_IMAGE" \
          --arg image_id "$image_id" \
          '{sha: $sha, platform: $platform, image: $image, image_id: $image_id, validated: false}' \
          > "$REPORT_DIR/status.json"
    - name: Smoke-test the complete image
      id: complete-image-smoke
      background: true
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
        SMOKE_IMAGE: autogpt-platform-single-container:ci-${{ matrix.suffix }}
        SMOKE_PLATFORM: ${{ matrix.platform }}
        SMOKE_SCAN_COMPLETION_FILE: ${{ runner.temp }}/platform-single-container-results/scans-complete
      run: python3 .github/scripts/run_command_junit.py --name complete-image-smoke --classname single-container.smoke
        --output "$REPORT_DIR/smoke.xml" -- bash .github/scripts/platform-single-container-smoke.sh
    - name: Install Trivy
      continue-on-error: true
      shell: bash
      run: bash .github/scripts/install-trivy.sh
    - name: Scan for fixable critical vulnerabilities
      id: vulnerability_scan
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        skip-setup-trivy: true
        cache: false
        image-ref: autogpt-platform-single-container:ci-${{ matrix.suffix }}
        scanners: vuln
        format: json
        output: ${{ runner.temp }}/platform-single-container-results/trivy-critical.json
        ignore-unfixed: true
        severity: CRITICAL
        exit-code: '1'
        timeout: 30m
        trivyignores: autogpt_platform/single-container/.trivyignore.yaml
    - name: Scan image filesystem for embedded secrets
      id: secret_scan
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        skip-setup-trivy: true
        cache: false
        image-ref: autogpt-platform-single-container:ci-${{ matrix.suffix }}
        scanners: secret
        format: json
        output: ${{ runner.temp }}/platform-single-container-results/trivy-secrets.json
        severity: HIGH,CRITICAL
        exit-code: '1'
        timeout: 30m
        trivyignores: autogpt_platform/single-container/.trivyignore.yaml
    - name: Signal concurrent scans complete
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SCAN_COMPLETION_FILE: ${{ runner.temp }}/platform-single-container-results/scans-complete
      run: touch "$SCAN_COMPLETION_FILE"
    - name: Wait for complete-image smoke test
      wait: complete-image-smoke
    - name: Verify machine-readable reports
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
        SMOKE_IMAGE: autogpt-platform-single-container:ci-${{ matrix.suffix }}
        SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
        VULNERABILITY_SCAN_OUTCOME: ${{ steps.vulnerability_scan.outcome }}
      run: |
        scan_failed=0
        if [[ "$VULNERABILITY_SCAN_OUTCOME" != "success" ]]; then
          echo "vulnerability scan action concluded $VULNERABILITY_SCAN_OUTCOME" >&2
          scan_failed=1
        fi
        if [[ "$SECRET_SCAN_OUTCOME" != "success" ]]; then
          echo "secret scan action concluded $SECRET_SCAN_OUTCOME" >&2
          scan_failed=1
        fi
        reports=(
          runtime-helpers.xml
          publication-policy.xml
          smoke.xml
          trivy-critical.json
          trivy-secrets.json
        )
        for report in "${reports[@]}"; do
          if [[ ! -s "$REPORT_DIR/$report" ]]; then
            echo "missing machine-readable report: $report" >&2
            exit 1
          fi
        done
        python3 .github/scripts/verify_single_container_reports.py \
          --report-dir "$REPORT_DIR" \
          --expected-image "$SMOKE_IMAGE"
        ((scan_failed == 0))
    - name: Mark validation complete
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/platform-single-container-results
      run: |
        jq '.validated = true' "$REPORT_DIR/status.json" > "$REPORT_DIR/status.complete.json"
        mv "$REPORT_DIR/status.complete.json" "$REPORT_DIR/status.json"
    - name: Upload single-container reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: platform-single-container-ci-${{ matrix.suffix }}-${{ matrix.mode }}-${{ matrix.repeat }}
        path: ${{ runner.temp }}/platform-single-container-results
        if-no-files-found: error
        retention-days: 7
