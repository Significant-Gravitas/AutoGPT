name: Temporary repair linked preflight indentation

on:
  push:
    branches: [fix-ollama-credentials]
    paths:
      - .github/workflows/temporary-repair-linked-preflight-indentation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-ollama-credentials

      - name: Repair Python indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          utils_path = Path("autogpt_platform/backend/backend/executor/utils.py")
          utils = utils_path.read_text()
          loop_start = utils.index(
              "        for field_name, credentials_meta_type in credentials_fields.items():\n"
          )
          reference_start = utils.index(
              "            reference_only = field_info.credential_reference_only\n",
              loop_start,
          )
          replacement = "\n".join(
              [
                  "        for field_name, credentials_meta_type in credentials_fields.items():",
                  "            field_info = credentials_fields_info[field_name]",
                  "            no_auth_credentials = get_no_auth_credentials(field_info, validation_input)",
                  "",
                  "            configured_field_value = None",
                  "            if (",
                  "                nodes_input_masks",
                  "                and (node_input_mask := nodes_input_masks.get(node.id))",
                  "                and field_name in node_input_mask",
                  "            ):",
                  "                configured_field_value = node_input_mask[field_name]",
                  "            elif field_name in node.input_default:",
                  "                configured_field_value = node.input_default[field_name]",
                  "",
                  "            field_has_configured_credentials = not (",
                  "                configured_field_value is None",
                  "                or (",
                  "                    isinstance(configured_field_value, dict)",
                  "                    and not configured_field_value.get(\"id\")",
                  "                )",
                  "            )",
                  "            discriminator_is_resolved = (",
                  "                field_info.discriminator is None",
                  "                or field_info.discriminator in validation_input",
                  "            )",
                  "            if no_auth_credentials is not None and (",
                  "                discriminator_is_resolved or not field_has_configured_credentials",
                  "            ):",
                  "                # A concrete credential-free variant can skip lookup entirely. If",
                  "                # the discriminator is unresolved, only defer when no credential was",
                  "                # configured; configured credentials must still be validated now.",
                  "                continue",
                  "",
                  "",
              ]
          )
          utils_path.write_text(utils[:loop_start] + replacement + utils[reference_start:])

          store_path = Path("autogpt_platform/backend/backend/integrations/credentials_store.py")
          store = store_path.read_text()
          method_start = store.index("    async def get_creds_by_id(\n")
          method_end = store.index("\n    async def get_creds_by_provider(", method_start)
          method = "\n".join(
              [
                  "    async def get_creds_by_id(",
                  "        self, user_id: str, credentials_id: str",
                  "    ) -> Credentials | None:",
                  "        # Keep legacy Ollama graph references resolvable without exposing the",
                  "        # internal compatibility credential in the user's credentials list.",
                  "        if credentials_id == ollama_credentials.id:",
                  "            return ollama_credentials",
                  "        all_credentials = await self.get_all_creds(user_id)",
                  "        return next((c for c in all_credentials if c.id == credentials_id), None)",
              ]
          )
          store_path.write_text(store[:method_start] + method + store[method_end:])
          PY

      - name: Validate syntax
        run: |
          python -m py_compile autogpt_platform/backend/backend/executor/utils.py
          python -m py_compile autogpt_platform/backend/backend/integrations/credentials_store.py

      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/temporary-repair-linked-preflight-indentation.yml
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add autogpt_platform/backend/backend/executor/utils.py autogpt_platform/backend/backend/integrations/credentials_store.py .github/workflows/temporary-repair-linked-preflight-indentation.yml
          git diff --cached --check
          git commit -m "fix(platform/llm): repair linked credential preflight patch"
          git push origin HEAD:fix-ollama-credentials
