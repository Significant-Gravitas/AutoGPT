name: AutoGPT Platform - Frontend CI

on:
  push:
    branches: [master, dev]
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - ".github/scripts/validate_cobertura.py"
      - ".github/scripts/test_validate_cobertura.py"
      - ".github/scripts/test_frontend_cobertura_contract.py"
      - ".github/scripts/run_unittest_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  pull_request:
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - ".github/scripts/validate_cobertura.py"
      - ".github/scripts/test_validate_cobertura.py"
      - ".github/scripts/test_frontend_cobertura_contract.py"
      - ".github/scripts/run_unittest_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'merge_group' && format('merge-queue-{0}', github.ref) || format('{0}-{1}', github.ref, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  tooltip-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # No --with-deps: the runner image already has Chromium's libraries, and the
        # apt fetch it adds can outlast the job's timeout when Ubuntu's mirror is slow.
        run: pnpm exec playwright install chromium
      - name: Test tooltip browser interactions
        run: pnpm test:tooltip
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooltip-browser-failures
          path: autogpt_platform/frontend/test-results/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          # The changed-files step below diffs against the base branch, so it
          # needs the history back to the merge base. `filter: blob:none`
          # fetches commits and trees only; a name-only diff without rename
          # detection reads no blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Test coverage report validator
        run: >-
          python3 ../../.github/scripts/run_unittest_junit.py
          --start-directory ../../.github/scripts
          --pattern 'test_*cobertura*.py'
          --suite-name frontend-coverage-validator
          --output coverage-validator-tests.xml

      - name: Upload coverage validator test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-validator-tests
          path: autogpt_platform/frontend/coverage-validator-tests.xml
          if-no-files-found: error

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run lint
        run: pnpm lint

      # `pnpm lint` only warns in the directories .oxlintrc.json lists as not
      # yet migrated. This step runs the strict config, which has no such list,
      # on every .tsx file a PR adds or changes.
      #
      # Report-only until the design-system migration lands: most existing
      # files still have strict violations, so a one-line edit would otherwise
      # fail the PR. The step exits non-zero when it finds violations, which
      # marks the step but not the job (continue-on-error). It writes a
      # summary and warning annotations. SECRT-3153 makes it blocking.
      - name: Lint changed files with the strict design-system config (report-only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff -z --name-only --relative --no-renames --diff-filter=ACMR \
            "origin/${BASE_REF}...HEAD" -- ':(glob)src/**/*.tsx' > "$RUNNER_TEMP/changed-tsx"
          status=0
          xargs -0 -r pnpm exec oxlint -c .oxlintrc.strict.json -f unix \
            < "$RUNNER_TEMP/changed-tsx" > "$RUNNER_TEMP/strict-lint.txt" || status=$?
          python3 - "$RUNNER_TEMP/changed-tsx" "$RUNNER_TEMP/strict-lint.txt" "$GITHUB_STEP_SUMMARY" <<'EOF'
          import collections, re, sys
          changed, report, summary = sys.argv[1:]
          files = [f for f in open(changed).read().split("\0") if f]
          line_re = re.compile(r"^(.+?):(\d+):(\d+): (.*) \[(?:Error|Warning)/(.+)\]$")
          per_file, per_rule = collections.Counter(), collections.Counter()
          for line in open(report):
              m = line_re.match(line.rstrip("\n"))
              if not m:
                  continue
              path, row, col, message, rule = m.groups()
              per_file[path] += 1
              per_rule[rule] += 1
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning file=autogpt_platform/frontend/{path},line={row},col={col},title={rule}::{message}")
          total = sum(per_file.values())
          out = [
              "### Strict design-system lint on changed files (report-only)\n",
              f"{len(files)} changed .tsx file(s) checked, {total} violation(s) in {len(per_file)} file(s). "
              "This does not fail the PR until SECRT-3153; fix what you can in the files you touch.\n",
          ]
          if total:
              out += ["| File | Violations |", "|---|--:|"]
              out += [f"| `{path}` | {count} |" for path, count in per_file.most_common()]
              out += ["", "| Rule | Violations |", "|---|--:|"]
              out += [f"| `{rule}` | {count} |" for rule, count in per_rule.most_common(5)]
          text = "\n".join(out) + "\n"
          print(text)
          with open(summary, "a") as handle:
              handle.write(text)
          EOF
          exit "$status"

  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # knip resolves imports into the generated client, which is gitignored.
      - name: Generate API client
        run: pnpm generate:api

      # Reports unused files, exports and dependencies. Informational for now:
      # the codebase has a backlog of findings, so they must not block PRs.
      # Scoped to this step so install/generate failures still fail the job.
      - name: Run knip
        continue-on-error: true
        run: pnpm knip --no-progress --reporter markdown | tee -a "$GITHUB_STEP_SUMMARY"

  chromatic:
    runs-on: ubuntu-latest
    # Disabled. Re-enable only for github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    # and a paths-filter match on autogpt_platform/frontend/src/components/**.
    if: ${{ false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@882b4728513a3720bfcd27bd9ad1260c603c6090 # v18.13.2
        with:
          projectToken: chpt_9e7c1a76478c9c8
          onlyChanged: true
          workingDir: autogpt_platform/frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          exitOnceUploaded: true

  integration_test:
    name: integration_test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate API client
        run: pnpm generate:api

      - name: Run Integration Tests
        run: >-
          pnpm exec vitest run
          --coverage
          --coverage.reportOnFailure
          --shard=${{ matrix.shard }}/4
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=./junit.xml

      - name: Validate JUnit test report
        if: ${{ always() }}
        run: >-
          python3 ../../.github/scripts/validate_junit.py
          --synthesize-invalid
          --require-no-skips
          junit.xml

      - name: Validate coverage report
        id: validate-frontend-coverage
        if: ${{ always() }}
        run: >-
          python3 ../../.github/scripts/validate_cobertura.py
          coverage/cobertura-coverage.xml

      - name: Upload machine-readable test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-integration-shard-${{ matrix.shard }}-of-4
          path: |
            autogpt_platform/frontend/junit.xml
            autogpt_platform/frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && steps.validate-frontend-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-frontend
          files: ./autogpt_platform/frontend/coverage/cobertura-coverage.xml
          disable_search: true
          name: frontend-shard-${{ matrix.shard }}-of-4
