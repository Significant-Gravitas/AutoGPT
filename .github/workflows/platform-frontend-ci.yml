name: AutoGPT Platform - Frontend CI

on:
  push:
    branches: [master, dev]
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  pull_request:
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'merge_group' && format('merge-queue-{0}', github.ref) || format('{0}-{1}', github.ref, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run lint
        run: pnpm lint

  chromatic:
    runs-on: ubuntu-latest
    # Disabled: remove this condition and restore component filtering to re-enable.
    if: ${{ false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: chpt_9e7c1a76478c9c8
          onlyChanged: true
          workingDir: autogpt_platform/frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          exitOnceUploaded: true

  integration_test:
    name: integration_test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate API client
        run: pnpm generate:api

      - name: Run Integration Tests
        run: >-
          pnpm exec vitest run
          --coverage
          --coverage.reportOnFailure
          --shard=${{ matrix.shard }}/4
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=./junit.xml

      - name: Validate JUnit test report
        if: ${{ always() }}
        run: >-
          python3 ../../.github/scripts/validate_junit.py
          --synthesize-invalid
          --require-no-skips
          junit.xml

      - name: Validate coverage report
        if: ${{ always() }}
        run: |
          report=coverage/cobertura-coverage.xml
          if [[ ! -s "$report" ]]; then
            echo "missing machine-readable report: $report" >&2
            exit 1
          fi
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$report')"

      - name: Upload machine-readable test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-integration-shard-${{ matrix.shard }}-of-4
          path: |
            autogpt_platform/frontend/junit.xml
            autogpt_platform/frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-frontend
          files: ./autogpt_platform/frontend/coverage/cobertura-coverage.xml
          disable_search: true
          name: frontend-shard-${{ matrix.shard }}-of-4
