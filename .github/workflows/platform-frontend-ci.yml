name: AutoGPT Platform - Frontend CI

on:
  push:
    branches: [master, dev]
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - ".github/scripts/validate_cobertura.py"
      - ".github/scripts/test_validate_cobertura.py"
      - ".github/scripts/test_frontend_cobertura_contract.py"
      - ".github/scripts/run_unittest_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  pull_request:
    paths:
      - ".github/workflows/platform-frontend-ci.yml"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - ".github/scripts/validate_cobertura.py"
      - ".github/scripts/test_validate_cobertura.py"
      - ".github/scripts/test_frontend_cobertura_contract.py"
      - ".github/scripts/run_unittest_junit.py"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/backend/Dockerfile"
      - "autogpt_platform/docker-compose.yml"
      - "autogpt_platform/docker-compose.platform.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'merge_group' && format('merge-queue-{0}', github.ref) || format('{0}-{1}', github.ref, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Test coverage report validator
        run: >-
          python3 ../../.github/scripts/run_unittest_junit.py
          --start-directory ../../.github/scripts
          --pattern 'test_*cobertura*.py'
          --suite-name frontend-coverage-validator
          --output coverage-validator-tests.xml

      - name: Upload coverage validator test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-validator-tests
          path: autogpt_platform/frontend/coverage-validator-tests.xml
          if-no-files-found: error

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run lint
        run: pnpm lint

  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # knip resolves imports into the generated client, which is gitignored.
      - name: Generate API client
        run: pnpm generate:api

      # Fails on unused files, exports and dependencies. The backlog that
      # existed when this became blocking is listed in knip.json.
      - name: Run knip
        run: pnpm knip --no-progress --reporter markdown | tee -a "$GITHUB_STEP_SUMMARY"

  chromatic:
    runs-on: ubuntu-latest
    # Secrets cannot be read in a job-level `if`, so every step checks the
    # token instead: without a CHROMATIC_PROJECT_TOKEN repository secret
    # (forks, or before the secret is added) the job passes as a no-op.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout repository
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm install --frozen-lockfile

      # Stories import the generated MSW handlers, which are gitignored.
      - name: Generate API client
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm generate:api

      - name: Run Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@latest
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          workingDir: autogpt_platform/frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          exitOnceUploaded: true

  build-storybook:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only pull requests that touch the design system pay for a build.
      - name: Check for design-system changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- src/components; then
            echo "components=false" >> "$GITHUB_OUTPUT"
          else
            echo "components=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.components == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        if: steps.changes.outputs.components == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changes.outputs.components == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      # Stories import the generated MSW handlers, which are gitignored.
      - name: Generate API client
        if: steps.changes.outputs.components == 'true'
        run: pnpm generate:api

      # Minifying the full Storybook needs more than Node's default heap.
      - name: Build Storybook
        if: steps.changes.outputs.components == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build-storybook --quiet

  integration_test:
    name: integration_test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate API client
        run: pnpm generate:api

      # The `storybook` Vitest project renders every story in headless
      # Chromium and runs axe on it.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run integration and story tests
        run: >-
          pnpm exec vitest run
          --coverage
          --coverage.reportOnFailure
          --shard=${{ matrix.shard }}/4
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile.junit=./junit.xml

      - name: Validate JUnit test report
        if: ${{ always() }}
        run: >-
          python3 ../../.github/scripts/validate_junit.py
          --synthesize-invalid
          --require-no-skips
          junit.xml

      - name: Validate coverage report
        id: validate-frontend-coverage
        if: ${{ always() }}
        run: >-
          python3 ../../.github/scripts/validate_cobertura.py
          coverage/cobertura-coverage.xml

      - name: Upload machine-readable test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-integration-shard-${{ matrix.shard }}-of-4
          path: |
            autogpt_platform/frontend/junit.xml
            autogpt_platform/frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && steps.validate-frontend-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-frontend
          files: ./autogpt_platform/frontend/coverage/cobertura-coverage.xml
          disable_search: true
          name: frontend-shard-${{ matrix.shard }}-of-4
