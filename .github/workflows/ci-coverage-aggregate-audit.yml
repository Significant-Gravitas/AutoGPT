name: Audit combined backend coverage
"on":
  push:
    branches:
      - codex/ci-coverage-aggregate-20261119
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out matching application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: ".github

            autogpt_platform/backend

            autogpt_platform/autogpt_libs"
      - name: Download and verify all 66 exact artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          python3 .github/ci-diagnostics/download-exact-coverage-artifacts.py .github/ci-diagnostics/coverage-aggregate-manifest.json
          reports
      - name: Validate source, case inventory and raw report completeness
        run:
          python3 .github/ci-diagnostics/audit-combined-backend-coverage.py prepare --reports reports
          --manifest .github/ci-diagnostics/coverage-aggregate-manifest.json --backend autogpt_platform/backend
      - name: Install the same coverage version in an isolated tool environment
        run: 'python3 -m venv "$RUNNER_TEMP/coverage-audit"

          "$RUNNER_TEMP/coverage-audit/bin/pip" install --disable-pip-version-check coverage==7.13.5

          '
      - name: Combine raw branch coverage and generate one complete XML report
        working-directory: autogpt_platform/backend
        run:
          '"$RUNNER_TEMP/coverage-audit/bin/python" ../../.github/scripts/report_backend_coverage.py
          --data-file .coverage-diagnostic --output coverage-diagnostic.xml'
      - name: Require exact independent coverage-union counts before upload
        run: python3 .github/ci-diagnostics/audit-combined-backend-coverage.py verify --xml autogpt_platform/backend/coverage-diagnostic.xml
      - name: Upload complete coverage on this diagnostic commit only
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-backend
          override_commit: ${{ github.sha }}
          disable_search: true
          fail_ci_if_error: true
          files: ./autogpt_platform/backend/coverage-diagnostic.xml
      - name: Retain aggregate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-coverage-aggregate-audit
          path: "autogpt_platform/backend/coverage-diagnostic.xml

            autogpt_platform/backend/coverage-diagnostic.summary.json

            autogpt_platform/backend/.coverage-diagnostic"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
