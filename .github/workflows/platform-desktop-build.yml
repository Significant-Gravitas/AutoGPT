name: AutoGPT Platform - Experimental desktop

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/platform-desktop-build.yml"
      - "autogpt_platform/desktop/**"
      - "autogpt_platform/backend/**"
      - "autogpt_platform/autogpt_libs/**"
      - "autogpt_platform/frontend/**"
      - "autogpt_platform/single-container/**"
      - "autogpt_platform/db/init/**"
  workflow_dispatch:
    inputs:
      package:
        description: Build unsigned experimental Windows and macOS installers (no release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/desktop

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  AUTOGPT_DESKTOP_BUILD_HEAP_MB: "4096"

jobs:
  checks:
    name: Desktop checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install test dependencies at backend lock versions
        run: |
          python -m pip install uv==0.12.1
          python build/lock_export.py ../backend/poetry.lock "$RUNNER_TEMP/desktop-constraints.txt"
          uv pip install --system --constraint "$RUNNER_TEMP/desktop-constraints.txt" pytest pytest-asyncio aiohttp psutil psycopg2-binary redis pika bcrypt cryptography uvicorn
      - name: Runtime and build contracts
        run: python -B -m pytest -q -p no:cacheprovider -c runtime/pyproject.toml runtime/tests build/tests
      - name: Electron shell unit tests
        run: npm test

  package:
    name: Experimental installer (${{ matrix.os }})
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.package) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'desktop-build'))
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      AUTOGPT_DESKTOP_VARIANT: experimental
      AUTOGPT_DESKTOP_VERSION: 0.0.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: native_python
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install build driver
        run: python -m pip install uv==0.12.1
      - name: Prepare MSYS2 for native Windows Valkey
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: true
          install: gcc make pkgconf tar curl
      - name: Write pinned Valkey build inputs
        if: runner.os == 'Windows'
        run: python -c "import os, sys; from pathlib import Path; sys.path.insert(0, 'build'); import artifacts as a; Path(os.environ['RUNNER_TEMP'], 'desktop-valkey-pin.txt').write_text(a.VALKEY_VERSION + ' ' + a.ARTIFACTS['darwin-arm64']['valkey'].sha256 + '\n', encoding='utf-8', newline='\n')"
      - name: Build native Windows Valkey
        id: valkey
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          read -r version digest < "$(cygpath -u "$RUNNER_TEMP")/desktop-valkey-pin.txt"
          bash build/valkey-windows.sh "$version" build/.cache/valkey-windows "$digest"
      - name: Validate Windows Valkey with native Python
        id: valkey_native
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ steps.native_python.outputs.python-path }}" -B build/valkey_windows_check.py build/.cache/valkey-windows
          exit $LASTEXITCODE
      - name: Retain failed Windows Valkey build evidence
        if: failure() && runner.os == 'Windows' && (steps.valkey.outcome == 'failure' || steps.valkey_native.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-valkey-failure-${{ github.sha }}
          path: |
            autogpt_platform/desktop/build/.cache/valkey-windows/*.exe
            autogpt_platform/desktop/build/.cache/valkey-windows/*.dll
            autogpt_platform/desktop/build/.cache/valkey-windows/COPYING
            autogpt_platform/desktop/build/.cache/valkey-windows-diagnostics/*.txt
            autogpt_platform/desktop/build/.cache/valkey-windows-diagnostics/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Assemble and verify native runtime from this checkout
        run: python -B build/build_runtime.py
      - name: Package without publishing
        run: |
          npm ci
          npm test
          npm run dist -- --publish never
      - name: Record build inputs
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          files = ["../backend/poetry.lock", "../backend/pyproject.toml", "../autogpt_libs/pyproject.toml", "../frontend/pnpm-lock.yaml", "../frontend/package.json", "package-lock.json", "package.json", "build/artifacts.py"]
          record = {
              "commit": os.environ["GITHUB_SHA"],
              "runner": platform.platform(),
              "variant": os.environ["AUTOGPT_DESKTOP_VARIANT"],
              "version": os.environ["AUTOGPT_DESKTOP_VERSION"],
              "sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
          }
          Path("dist/build-inputs.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Retain experimental installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-experimental-${{ matrix.os }}-${{ github.sha }}
          path: |
            autogpt_platform/desktop/dist/*.exe
            autogpt_platform/desktop/dist/*.dmg
            autogpt_platform/desktop/dist/build-inputs.json
          if-no-files-found: error
          retention-days: 7

  installed_windows:
    name: Installed Windows lifecycle
    needs: package
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Download this run's Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-experimental-windows-2025-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-installer
      - name: Install process inspection dependency at the backend lock version
        run: |
          python -m pip install uv==0.12.1
          python build/lock_export.py ../backend/poetry.lock "$RUNNER_TEMP/desktop-constraints.txt"
          uv pip install --system --constraint "$RUNNER_TEMP/desktop-constraints.txt" psutil
      - name: Install and exercise the packaged runtime
        shell: pwsh
        run: |
          python -B build/installed_smoke_windows.py `
            --artifact-dir "$env:RUNNER_TEMP/desktop-installer" `
            --work-dir "$env:RUNNER_TEMP/desktop-installed-smoke" `
            --expected-commit "${{ github.sha }}"
          exit $LASTEXITCODE
      - name: Retain the installed runtime test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installed-windows-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-installed-smoke/result.json
          if-no-files-found: warn
          retention-days: 7
