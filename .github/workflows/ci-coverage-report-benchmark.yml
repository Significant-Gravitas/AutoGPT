name: Compare complete coverage report generation
on:
  push:
    branches: [codex/ci-coverage-report-benchmark-20261103-1725]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Coverage report (${{ matrix.python }}, ${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        order: [baseline-first, candidate-first]
    defaults:
      run:
        working-directory: autogpt_platform/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned coverage reporter
        run: |
          python -m venv "$RUNNER_TEMP/reporter"
          for package in coverage pytest pytest-cov ruff; do
            version=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py "$package")
            "$RUNNER_TEMP/reporter/bin/pip" install "$package==$version"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41673952967
          name: backend-test-reports-py${{ matrix.python }}-util-executor-3
          path: ${{ runner.temp }}/coverage-input
      - name: Compare full XML and record runtime and process memory
        run: '"$RUNNER_TEMP/reporter/bin/python" ../../.github/scripts/benchmark_coverage_reporting.py "${{ matrix.order }}"'
      - name: Verify production reporter contracts and lint
        run: |
          cp ../../.github/scripts/parallel_coverage_candidate.py ../../.github/scripts/report_backend_coverage.py
          "$RUNNER_TEMP/reporter/bin/ruff" check --select E4,E7,E9,F,I ../../.github/scripts/report_backend_coverage.py ../../.github/scripts/test_report_backend_coverage.py
          "$RUNNER_TEMP/reporter/bin/python" -m unittest discover -s ../../.github/scripts -p test_report_backend_coverage.py -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-report-${{ matrix.python }}-${{ matrix.order }}
          path: |
            ${{ runner.temp }}/coverage-comparison/*.json
            ${{ runner.temp }}/coverage-comparison/*.txt
            ${{ runner.temp }}/coverage-comparison/*.log
          retention-days: 3
