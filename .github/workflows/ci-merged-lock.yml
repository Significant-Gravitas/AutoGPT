name: Validate merged Python support lock
'on':
  push:
    branches:
    - codex/ci-merged-lock-20261117
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        filter: blob:none
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.6
        enable-cache: false
    - name: Regenerate and validate the merged lock
      working-directory: autogpt_platform/backend
      run: "set -euo pipefail\ncp poetry.lock \"$RUNNER_TEMP/poetry-before.lock\"\nversion=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py\
        \ poetry poetry.lock)\nuvx --from \"poetry==$version\" poetry lock --no-interaction\nuvx --from\
        \ \"poetry==$version\" poetry check --lock\npython - <<'PY'\nimport json, os, tomllib\nfrom pathlib\
        \ import Path\nbefore=tomllib.loads(Path(os.environ['RUNNER_TEMP'], 'poetry-before.lock').read_text())\n\
        after=tomllib.loads(Path('poetry.lock').read_text())\ndef inventory(lock):\n    return {p['name']:\
        \ (p['version'],p.get('source')) for p in lock['package']}\nold,new=inventory(before),inventory(after)\n\
        changed={k:[old.get(k),new.get(k)] for k in old.keys()|new.keys() if old.get(k)!=new.get(k)}\n\
        assert set(changed) <= {'async-timeout'},changed\nassert after['metadata']['python-versions']=='>=3.12,<3.14'\n\
        Path(os.environ['RUNNER_TEMP'], 'lock-changes.json').write_text(json.dumps(changed,indent=2))\n\
        print(json.dumps(changed,indent=2))\nPY\ngit diff -- poetry.lock > \"$RUNNER_TEMP/lock.diff\"\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: merged-backend-lock
        path: 'autogpt_platform/backend/poetry.lock

          ${{ runner.temp }}/lock-changes.json

          ${{ runner.temp }}/lock.diff'
        if-no-files-found: error
        retention-days: 7
