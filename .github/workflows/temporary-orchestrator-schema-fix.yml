name: Temporary orchestrator schema fix

on:
  push:
    branches:
      - fix-ollama-credentials
    paths:
      - .github/workflows/temporary-orchestrator-schema-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ollama-credentials
      - name: Restore credential schema annotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('autogpt_platform/backend/backend/blocks/orchestrator.py')
          text = path.read_text()
          old = 'credentials: llm.AICredentials | None = llm.AICredentialsField()'
          new = 'credentials: llm.AICredentials = llm.AICredentialsField()'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autogpt_platform/backend/backend/blocks/orchestrator.py
          git diff --cached --check
          git commit -m "fix(platform/llm): preserve orchestrator credential schema"
          git push origin HEAD:fix-ollama-credentials
