name: MCP Auth Formatting Helper

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-auth-format-helper.yml"
      - "autogpt_platform/frontend/src/app/(platform)/build/components/MCPToolDialog.tsx"
      - "autogpt_platform/frontend/src/components/contextual/IntegrationsPanel/components/ConnectServiceDialog/components/DetailView/McpConnectPanel.tsx"
      - "autogpt_platform/frontend/src/lib/mcp-auth.test.ts"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm prettier --write \
            'src/app/(platform)/build/components/MCPToolDialog.tsx' \
            'src/components/contextual/IntegrationsPanel/components/ConnectServiceDialog/components/DetailView/McpConnectPanel.tsx' \
            'src/lib/mcp-auth.test.ts'

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: mcp-auth-formatted-files
          path: |
            autogpt_platform/frontend/src/app/(platform)/build/components/MCPToolDialog.tsx
            autogpt_platform/frontend/src/components/contextual/IntegrationsPanel/components/ConnectServiceDialog/components/DetailView/McpConnectPanel.tsx
            autogpt_platform/frontend/src/lib/mcp-auth.test.ts
          if-no-files-found: error
