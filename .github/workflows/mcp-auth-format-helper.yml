name: MCP Auth Formatting Helper

on:
  push:
    branches:
      - feat/mcp-auth-schemes
    paths:
      - ".github/workflows/mcp-auth-format-helper.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/mcp-auth-schemes

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply review fix and format changed files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/(platform)/build/components/MCPToolDialog.tsx")
          source = path.read_text()
          old = "        if (response.status !== 200) throw response.data;\n"
          new = (
              "        if (response.status !== 200) {\n"
              "          throw { status: response.status, detail: response.data };\n"
              "        }\n"
          )
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit("Expected MCP discovery status check was not found")
          PY

          pnpm prettier --write \
            'src/app/(platform)/build/components/MCPToolDialog.tsx' \
            'src/components/contextual/IntegrationsPanel/components/ConnectServiceDialog/components/DetailView/McpConnectPanel.tsx' \
            'src/lib/mcp-auth.test.ts'

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'src/app/(platform)/build/components/MCPToolDialog.tsx' \
            'src/components/contextual/IntegrationsPanel/components/ConnectServiceDialog/components/DetailView/McpConnectPanel.tsx' \
            'src/lib/mcp-auth.test.ts'
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "fix(platform): preserve MCP discovery auth status"
          git push origin HEAD:feat/mcp-auth-schemes
