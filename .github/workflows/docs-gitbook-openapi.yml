name: Docs - Publish the API spec to GitBook

# The API reference on agpt.co/docs is generated by GitBook from an OpenAPI
# spec stored in the GitBook organization as `autogpt-api-v2`, the slug that
# docs/platform/SUMMARY.md names. This republishes the spec from master, the
# commit docs-gitbook-sync.yml copies the guides from, so the reference and the
# guides describe the same API.
#
# Needs the GITBOOK_TOKEN secret (a GitBook API token of an organization admin)
# and the GITBOOK_ORGANIZATION_ID variable (the segment after /o/ in GitBook's
# app URLs). Without them the run is skipped, not failed.
on:
  push:
    branches: [master]
    paths:
      - "autogpt_platform/backend/backend/api/external/**"
      - ".github/workflows/docs-gitbook-openapi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITBOOK_ORGANIZATION_ID: ${{ vars.GITBOOK_ORGANIZATION_ID }}
        run: |
          if [ -n "$GITBOOK_TOKEN" ] && [ -n "$GITBOOK_ORGANIZATION_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GITBOOK_TOKEN or GITBOOK_ORGANIZATION_ID is not set; not publishing the API spec."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    # Only master's spec is what the published docs describe.
    if: >-
      needs.check.outputs.ready == 'true'
      && github.repository == 'Significant-Gravitas/AutoGPT'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docs-gitbook-openapi
      cancel-in-progress: true
    defaults:
      run:
        working-directory: autogpt_platform/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$POETRY_VERSION python3 -

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('autogpt_platform/backend/poetry.lock') }}

      - name: Install the backend
        run: poetry install --only main

      - name: Generate the Prisma client
        run: poetry run prisma generate && poetry run gen-prisma-stub

      - name: Export the v2 OpenAPI spec
        run: poetry run export-api-schema --api v2 --pretty --output "$RUNNER_TEMP/autogpt-api-v2.json"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Publish to GitBook
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITBOOK_ORGANIZATION_ID: ${{ vars.GITBOOK_ORGANIZATION_ID }}
        run: |
          npx --yes @gitbook/cli@0.32.9 openapi publish \
            --spec autogpt-api-v2 \
            --organization "$GITBOOK_ORGANIZATION_ID" \
            "$RUNNER_TEMP/autogpt-api-v2.json"
