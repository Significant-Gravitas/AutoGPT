name: Temporary phantom-edge validation

on:
  push:
    branches: [fix/autopilot-phantom-output-edges]
    paths:
      - .github/workflows/temporary-validate-phantom-edges.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopilot-phantom-output-edges
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend lint
        run: pnpm lint
      - name: Run focused regression test
        run: pnpm exec vitest run 'src/app/(platform)/build/__tests__/OutputHandler.test.tsx'
      - name: Remove temporary workflow and push cleanup
        working-directory: .
        run: |
          rm .github/workflows/temporary-validate-phantom-edges.yml
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary phantom-edge validation workflow"
          git push origin HEAD:fix/autopilot-phantom-output-edges
