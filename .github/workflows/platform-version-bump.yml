name: AutoGPT Platform - Bump version after a release

# A published platform release sets the backend's pyproject.toml and the
# frontend's package.json to the release's version, through a pull request to
# dev that merges itself: nobody runs this by hand or merges the bump.
#
# The pull request is opened as the batch-bot App, so its CI runs (a PR
# opened with GITHUB_TOKEN gets none), and auto-merge puts it in the merge
# queue. dev's rules still need one approving review. The PR reviewer bot
# gives it when it lists the App's login, autogpt-batch-bot[bot], as an
# author to review automatically (its repository page, Review triggers);
# a `/review` from a bot is ignored. Until then, one `/review` comment from
# a person starts that review. Nothing here bypasses dev's rules.
#
# A version that dev already has, or passed, opens nothing: a hotfix on an
# older line can't move dev back. A second release before the first bump
# merges updates the same pull request.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: platform-version-bump
  cancel-in-progress: false

jobs:
  bump:
    # Every published release starts this workflow, and not all of them are
    # the platform's (the rolling preview-seed-fixture is a prerelease).
    if: startsWith(github.event.release.tag_name, 'autogpt-platform-') && !github.event.release.prerelease
    name: Open the version bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: dev
          persist-credentials: false

      - name: Set the versions from the release tag
        id: bump
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/workflows/scripts/bump_platform_version.py "$TAG"

      # Minted after the files are changed, and handed only to the PR steps.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.bump.outputs.changed == 'true'
        id: app-token
        with:
          app-id: ${{ vars.BATCH_BOT_APP_ID }}
          private-key: ${{ secrets.BATCH_BOT_PRIVATE_KEY }}
          permission-contents: write # push the bump branch, enable auto-merge
          permission-pull-requests: write # open or update the bump PR

      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commits made through the API as the App, so they are signed and
          # attributed to it rather than to whoever published the release.
          sign-commits: true
          base: dev
          branch: automation/platform-version-bump
          delete-branch: true
          title: "chore(platform): bump version to ${{ steps.bump.outputs.version }}"
          commit-message: "chore(platform): bump version to ${{ steps.bump.outputs.version }}"
          add-paths: |
            autogpt_platform/backend/pyproject.toml
            autogpt_platform/frontend/package.json
          body: |
            ### Changes 🏗️

            Sets the backend's `pyproject.toml` and the frontend's `package.json` to ${{ steps.bump.outputs.version }}, the version of release [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}). Only the two version lines change.

            Opened by `.github/workflows/platform-version-bump.yml` when the release was published. Auto-merge is on, so it merges once it is approved and CI passes.

            ### Agents and large language models used

            None. Generated by the version bump workflow.

            ### Checklist 📋

            - [x] Only the version lines of `pyproject.toml` and `package.json` changed

      - name: Turn on auto-merge
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        id: auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --repo "$GITHUB_REPOSITORY"
