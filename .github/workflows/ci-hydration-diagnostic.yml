name: Repeat unchanged onboarding journeys
"on":
  push:
    branches:
      - codex/ci-hydration-diagnostic-20261119
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend
jobs:
  diagnose:
    name: Repeat original onboarding journeys with coverage
    continue-on-error: false
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: journeys
            config: playwright.journeys.config.ts
            playwright_args: --project hosted
            min_tests: 18
            embeddings: false
            seed: false
            hosted: true
            scripted_model: true
            known_failures: false
            partition: 0
    permissions:
      contents: read
      packages: read
    env:
      BUILD_CACHE_IMAGE: ghcr.io/significant-gravitas/autogpt-platform-e2e-buildcache
      E2E_SEED_IMAGE: ghcr.io/significant-gravitas/autogpt-platform-e2e-seed
      WRITE_BUILD_CACHE: "false"
      BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: "/*

            !/docs/platform/.gitbook/assets/*.png

            !/docs/platform/.gitbook/assets/*.gif

            "
      - name: Set up tests - Compute E2E test data cache key
        id: e2e-seed-key
        if: matrix.seed
        working-directory: .
        env:
          EMBEDDINGS: ${{ matrix.embeddings && 'emb' || 'noemb' }}
        run:
          "inputs_hash=$(\n  {\n    git ls-files -s -- \\\n      autogpt_platform/backend/test/e2e_test_data.py\
          \ \\\n      autogpt_platform/backend/agents/calculator-agent.json \\\n      autogpt_platform/backend/schema.prisma\
          \ \\\n      autogpt_platform/backend/migrations \\\n      autogpt_platform/backend/backend/api/features/library/db.py\
          \ \\\n      autogpt_platform/backend/backend/api/features/library/model.py \\\n      autogpt_platform/backend/backend/api/features/orgs/db.py\
          \ \\\n      autogpt_platform/backend/backend/api/features/search/embeddings.py \\\n      autogpt_platform/backend/backend/api/features/store/db.py\
          \ \\\n      autogpt_platform/backend/backend/data/auth/api_key.py \\\n      autogpt_platform/backend/backend/data/credit.py\
          \ \\\n      autogpt_platform/backend/backend/data/graph.py \\\n      autogpt_platform/backend/backend/data/org_migration.py\
          \ \\\n      autogpt_platform/backend/backend/data/profile.py \\\n      autogpt_platform/backend/backend/data/user.py\
          \ \\\n      autogpt_platform/backend/backend/util/json.py\n    sed -n '/- name: Set up tests - Create\
          \ E2E test data$/,/^      - name:/p' \\\n      .github/workflows/platform-fullstack-ci.yml\n  } | sha256sum\
          \ | cut -c1-40\n)\necho \"tag=v4-${EMBEDDINGS}-${inputs_hash}\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Verify application source and test fixtures are present
        working-directory: .
        run: python3 .github/scripts/validate_ci_checkout.py
      - name: Set up Platform - Pull BuildKit image
        id: buildkit-image
        working-directory: /tmp
        timeout-minutes: 5
        background: true
        run:
          "if docker image inspect \"$BUILDKIT_IMAGE\" >/dev/null 2>&1; then\n  exit 0\nfi\nbash \"$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh\"\
          \ \"$BUILDKIT_IMAGE\"\n"
      - name: Set up Platform - Create .env files with generated secrets
        working-directory: autogpt_platform
        run: make init-env
      - name: Set up Platform - Configure backend .env
        run:
          "if [[ \"${{ matrix.embeddings }}\" == \"true\" ]]; then\n  echo \"OPENAI_INTERNAL_API_KEY=${{ secrets.OPENAI_API_KEY\
          \ }}\" >> ../backend/.env\nfi\n# The journeys leg's AutoPilot talks to the scripted model instead\n\
          # (docker-compose.journeys.yml).\nif [[ \"${{ matrix.scripted_model }}\" != \"true\" ]]; then\n  echo\
          \ \"CHAT_TEST_MODE=true\" >> ../backend/.env\nfi\necho \"SCHEDULER_STARTUP_EMBEDDING_BACKFILL=false\"\
          \ >> ../backend/.env\n"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Set up Platform - Configure hosted backend .env
        if: matrix.hosted
        run: python ../../.github/scripts/hosted_journeys_env.py >> ../backend/.env
      - name: Set up Platform - Log in to the GHCR build cache
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up tests - Pull cached E2E test data from GHCR
        id: e2e-seed-pull
        if: matrix.seed
        continue-on-error: true
        timeout-minutes: 3
        working-directory: /tmp
        run:
          "ref=\"$E2E_SEED_IMAGE:${E2E_SEED_TAG}\"\nif ! docker pull --quiet \"$ref\"; then\n  echo \"No cached\
          \ E2E test data at $ref; seeding instead\"\n  exit 0\nfi\ncontainer=$(docker create \"$ref\" none)\n\
          docker cp \"$container:/e2e_test_data.sql\" /tmp/e2e_test_data.sql\ndocker rm \"$container\" >/dev/null\n\
          docker rmi \"$ref\" >/dev/null\necho \"hit=true\" >> \"$GITHUB_OUTPUT\"\n"
        env:
          E2E_SEED_TAG: ${{ steps.e2e-seed-key.outputs.tag }}
      - name: Set up Platform - Prepare Docker build
        working-directory: autogpt_platform
        env:
          NEXT_PUBLIC_PW_TEST: true
          NEXT_PUBLIC_SOURCEMAPS: true
        run:
          "pip install pyyaml\n\n# Resolve extends and generate a flat compose file that bake can understand\n\
          export NEXT_PUBLIC_SOURCEMAPS NEXT_PUBLIC_PW_TEST\ncompose_files=(-f docker-compose.yml)\nif [[ \"\
          ${{ matrix.scripted_model }}\" == \"true\" ]]; then\n  compose_files+=(-f docker-compose.journeys.yml)\n\
          fi\ndocker compose \"${compose_files[@]}\" config > docker-compose.resolved.yml\n\n# Ensure NEXT_PUBLIC_SOURCEMAPS\
          \ is in resolved compose\n# (docker compose config on some versions drops this arg)\nif ! grep -q \"\
          NEXT_PUBLIC_SOURCEMAPS\" docker-compose.resolved.yml; then\n  echo \"Injecting NEXT_PUBLIC_SOURCEMAPS\
          \ into resolved compose (docker compose config dropped it)\"\n  sed -i '/NEXT_PUBLIC_PW_TEST/a\\  \
          \      NEXT_PUBLIC_SOURCEMAPS: \"true\"' docker-compose.resolved.yml\nfi\n\n# Generated runtime credentials\
          \ must not invalidate the build cache.\ncp frontend/.env \"$RUNNER_TEMP/frontend-test.env\"\npython\
          \ ../.github/scripts/frontend_ci_env.py \\\n  --compose docker-compose.resolved.yml --env frontend/.env\n\
          \n# Pull requests read the cache and never write it\nwrite_cache=()\nif [[ \"$WRITE_BUILD_CACHE\" ==\
          \ \"true\" ]]; then\n  write_cache=(--write-cache)\nfi\n\npython ../.github/workflows/scripts/docker-ci-fix-compose-build-cache.py\
          \ \\\n  --source docker-compose.resolved.yml \\\n  --cache-image \"$BUILD_CACHE_IMAGE\" \\\n  \"${write_cache[@]}\"\
          \n"
      - name: Set up Platform - Wait for BuildKit image
        wait:
          - buildkit-image
      - name: Set up Platform - Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          cleanup: false
          driver: docker-container
          driver-opts: "image=${{ env.BUILDKIT_IMAGE }}

            network=host

            "
      - name: Set up Platform - Log runner memory
        id: memory-log
        background: true
        run:
          "lowest=\n# e2e_test sets no job-level timeout-minutes, so GitHub's 360-minute\n# default is the\
          \ real ceiling; sample until then or the stop file,\n# whichever comes first, so a long build+seed\
          \ can't outlast the log.\nfor i in $(seq 2160); do\n  [ -f /tmp/stop-memory-log ] && break\n  read\
          \ -r used available < <(free -m | awk '/^Mem:/ {print $3, $7}')\n  swap=$(free -m | awk '/^Swap:/ {print\
          \ $3}')\n  echo \"$(date -u +%T) used=${used}M available=${available}M swap=${swap}M\"\n  if [ -z \"\
          $lowest\" ] || [ \"$available\" -lt \"$lowest\" ]; then lowest=$available; fi\n  # Once a minute, which\
          \ containers hold it\n  if (( i % 6 == 0 )); then docker stats --no-stream --format '  {{.Name}} {{.MemUsage}}'\
          \ || true; fi\n  sleep 10\ndone\necho \"Lowest available memory: ${lowest}M\"\n"
      - name: Set up Platform - Build backend Docker images
        id: platform-build-backend
        working-directory: autogpt_platform
        background: true
        run:
          "targets=$(python -c \"import yaml; s = yaml.safe_load(open('docker-compose.resolved.yml'))['services'];\
          \ print(' '.join(n for n, c in s.items() if 'build' in c and n != 'frontend'))\")\necho \"Baking: $targets\"\
          \n# The UTC date re-runs the backend's package installs once a day\n# (APT_REFRESH), so E2E tests the\
          \ OS packages that ship.\ndocker buildx bake --allow=fs.read=.. -f docker-compose.resolved.yml \\\n\
          \  --set '*.output=type=docker,compression=uncompressed' \\\n  --set \"*.args.APT_REFRESH=$(date -u\
          \ +%F)\" $targets\n"
      - name: Set up Platform - Build frontend Docker image
        id: platform-build-frontend
        working-directory: autogpt_platform
        background: true
        run:
          "# Lint and type checks run in their own jobs, so the e2e build skips them\ndocker buildx bake --allow=fs.read=..\
          \ -f docker-compose.resolved.yml \\\n  --set frontend.output=type=docker,compression=uncompressed \\\
          \n  --set frontend.args.NEXT_SKIP_BUILD_CHECKS=true frontend\n"
        env:
          NEXT_PUBLIC_PW_TEST: true
          NEXT_PUBLIC_SOURCEMAPS: true
      - name: Set up Platform - Pull service images and start database
        id: database
        background: true
        run:
          "# Every image `up` would pull, pulled now through the retry, so a brief\n# Docker Hub refusal can't\
          \ fail a later `up`.\nimages=$(python -c \"import yaml; s = yaml.safe_load(open('../docker-compose.resolved.yml'))['services'];\
          \ built = {c.get('image') for c in s.values() if 'build' in c}; print(' '.join(sorted({c['image'] for\
          \ c in s.values() if 'build' not in c} - built)))\")\nfor image in $images; do\n  bash \"$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh\"\
          \ \"$image\"\ndone\n# --no-deps: db depends_on rabbitmq (startup-ordering only, see\n# docker-compose.yml),\
          \ so without it this would start rabbitmq here\n# too, overlapping the frontend build. \"Start (all\
          \ other services)\"\n# brings rabbitmq up with everything else once the build is done.\ndocker compose\
          \ -f ../docker-compose.resolved.yml up -d db --no-build --no-deps\necho \"Waiting for database to be\
          \ ready...\"\ntimeout 60 sh -c 'until docker compose -f ../docker-compose.resolved.yml exec -T db pg_isready\
          \ -U postgres 2>/dev/null; do sleep 2; done'\n"
      - name: Set up tests - Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - name: Set up tests - Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - name: Set up tests - Cache Playwright browsers
        if: matrix.suite == 'smoke'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('autogpt_platform/frontend/pnpm-lock.yaml') }}
          restore-keys: "playwright-${{ runner.os }}-

            "
      - name: Set up tests - Restore Playwright browsers
        if: matrix.suite != 'smoke'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('autogpt_platform/frontend/pnpm-lock.yaml') }}
          restore-keys: "playwright-${{ runner.os }}-

            "
      - name: Set up tests - Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Set up tests - Install browser 'chromium'
        run: pnpm playwright install chromium
      - name: Wait for backend image build and database
        wait:
          - platform-build-backend
          - database
      - name: Set up Platform - Run migrations
        run:
          "echo \"Running migrations...\"\n# --no-deps: `run` resolves migrate's full dependency closure,\
          \ so\n# without it this starts rabbitmq too (db's own dependency, even\n# though db is already healthy\
          \ from the step above) during the build.\ndocker compose -f ../docker-compose.resolved.yml run --rm\
          \ --no-deps migrate\necho \"\u2705 Migrations completed\"\n"
        env:
          NEXT_PUBLIC_PW_TEST: true
      - name: Set up tests - Load cached E2E test data
        id: e2e-seed-restore
        if: steps.e2e-seed-pull.outputs.hit == 'true'
        run:
          "echo \"\u2705 Found cached E2E test data, restoring...\"\n# One transaction: a dump that no longer\
          \ fits the schema leaves\n# nothing behind, and the seed step below runs instead.\n{\n  echo \"SET\
          \ session_replication_role = 'replica';\"\n  cat /tmp/e2e_test_data.sql\n  echo \"SET session_replication_role\
          \ = 'origin';\"\n} | docker compose -f ../docker-compose.resolved.yml exec -T db psql -X -v ON_ERROR_STOP=1\
          \ --single-transaction -U postgres -d postgres -b || {\n  echo \"::warning title=e2e-seed-cache-stale::Cached\
          \ E2E test data did not load; seeding instead\"\n  exit 0\n}\n# Refresh materialized views after restore\n\
          docker compose -f ../docker-compose.resolved.yml exec -T db \\\n  psql -X -v ON_ERROR_STOP=1 -U postgres\
          \ -d postgres -b -c \"SET search_path TO platform; SELECT refresh_store_materialized_views();\"\n\n\
          echo \"restored=true\" >> \"$GITHUB_OUTPUT\"\necho \"\u2705 E2E test data restored from cache\"\n"
      - name: Wait for frontend image build
        wait:
          - platform-build-frontend
      - name: Restore runtime configuration for Playwright
        run: cp "$RUNNER_TEMP/frontend-test.env" .env
      - name: Set up Platform - Start (all other services)
        run:
          "# Everything but the frontend, which starts once the seed is in\ndocker compose -f ../docker-compose.resolved.yml\
          \ up -d --no-build \\\n  $(docker compose -f ../docker-compose.resolved.yml config --services | grep\
          \ -vx frontend)\necho \"Waiting for rest_server to be ready...\"\ntimeout 180 sh -c 'until curl -f\
          \ http://localhost:8006/health 2>/dev/null; do sleep 2; done' || {\n  echo \"\u274C rest_server did\
          \ not become healthy in 180s\"\n  docker compose -f ../docker-compose.resolved.yml logs --tail=100\
          \ rest_server\n  exit 1\n}\necho \"Waiting for scheduler_server to be ready...\"\n# Its port is internal\
          \ (not published to the host), so ask from\n# inside its own container; the image has Python but no\
          \ curl.\ntimeout 180 sh -c 'until docker compose -f ../docker-compose.resolved.yml exec -T scheduler_server\
          \ python -c \"import urllib.request; urllib.request.urlopen(\\\"http://localhost:8003/health_check\\\
          \", timeout=5)\" >/dev/null 2>&1; do sleep 2; done' || {\n  echo \"scheduler_server did not become\
          \ healthy in 180s\"\n  docker compose -f ../docker-compose.resolved.yml logs --tail=100 scheduler_server\n\
          \  exit 1\n}\n"
        env:
          NEXT_PUBLIC_PW_TEST: true
      - name: Set up tests - Verify cached seed credentials with fresh encryption key
        id: e2e-seed-verify-cached
        if: steps.e2e-seed-restore.outputs.restored == 'true'
        run:
          "docker cp ../backend/test/e2e_test_data.py $(docker compose -f ../docker-compose.resolved.yml ps\
          \ -q rest_server):/tmp/e2e_test_data.py\ndocker compose -f ../docker-compose.resolved.yml exec -T rest_server\
          \ \\\n  sh -c \"cd /app/autogpt_platform && python /tmp/e2e_test_data.py --refresh-credentials-only\"\
          \n"
      - name: Set up tests - Create E2E test data
        id: e2e-seed-create
        if: matrix.seed && steps.e2e-seed-restore.outputs.restored != 'true'
        timeout-minutes: 20
        env:
          EMBEDDINGS: ${{ matrix.embeddings }}
        run:
          "echo \"Creating E2E test data...\"\ndocker cp ../backend/test/e2e_test_data.py $(docker compose\
          \ -f ../docker-compose.resolved.yml ps -q rest_server):/tmp/e2e_test_data.py\ndocker compose -f ../docker-compose.resolved.yml\
          \ exec -T rest_server sh -c \"cd /app/autogpt_platform && python /tmp/e2e_test_data.py\" | tee /tmp/e2e_seed.log\
          \ || {\n  echo \"\u274C E2E test data creation failed!\"\n  docker compose -f ../docker-compose.resolved.yml\
          \ logs --tail=50 rest_server\n  exit 1\n}\n\n# Dump the platform schema for cache (includes the Better\
          \ Auth\n# user/session/account tables seeded by e2e_test_data.py)\necho \"Dumping database for cache...\"\
          \ndocker compose -f ../docker-compose.resolved.yml exec -T db \\\n  pg_dump -U postgres --data-only\
          \ --column-inserts \\\n  --schema=platform \\\n  --exclude-table='platform._prisma_migrations' \\\n\
          \  --exclude-table='platform.\"PaidUsageActivationPolicy\"' \\\n  --exclude-table='platform.apscheduler_jobs'\
          \ \\\n  --exclude-table='platform.apscheduler_jobs_batched_notifications' \\\n  postgres > /tmp/e2e_test_data.sql\n\
          \necho \"\u2705 Database dump created for caching ($(wc -l < /tmp/e2e_test_data.sql) lines)\"\n\n#\
          \ The seed only warns when the embedding backfill errors, stalls or\n# times out. Such a dump serves\
          \ this run but is not published.\nif [[ \"$EMBEDDINGS\" != \"true\" ]] || grep -q 'Embeddings complete:'\
          \ /tmp/e2e_seed.log; then\n  echo \"publishable=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::warning\
          \ title=e2e-seed-not-published::Embedding coverage is incomplete; this dump will not be pushed to GHCR\"\
          \nfi\n"
      - name: Set up tests - Verify seeded credentials with fresh encryption key
        id: e2e-seed-verify
        if: matrix.seed && steps.e2e-seed-restore.outputs.restored != 'true'
        run:
          "docker cp ../backend/test/e2e_test_data.py $(docker compose -f ../docker-compose.resolved.yml ps\
          \ -q rest_server):/tmp/e2e_test_data.py\ndocker compose -f ../docker-compose.resolved.yml exec -T rest_server\
          \ \\\n  sh -c \"cd /app/autogpt_platform && python /tmp/e2e_test_data.py --refresh-credentials-only\"\
          \n"
      - name: Set up Platform - Start frontend
        run:
          "docker compose -f ../docker-compose.resolved.yml up -d --no-build --no-deps frontend\necho \"Waiting\
          \ for frontend to be ready...\"\ntimeout 120 sh -c 'until curl -fsS -o /dev/null http://localhost:3000;\
          \ do sleep 2; done' || {\n  echo \"frontend did not become ready in 120s\"\n  docker compose -f ../docker-compose.resolved.yml\
          \ logs --tail=100 frontend\n  exit 1\n}\n"
      - name: Set up Platform - Initialize auth signing keys
        run:
          'docker compose -f ../docker-compose.resolved.yml exec -T rest_server python - <<''PY''

          import os

          from jwt import PyJWKClient


          PyJWKClient(os.environ["JWT_JWKS_URL"], timeout=5).get_signing_keys()

          PY

          '
      - name: Stop runner memory log
        if: always()
        run: touch /tmp/stop-memory-log
      - name: Wait for runner memory log
        wait:
          - memory-log
      - name: Copy source maps from Docker for E2E coverage
        run:
          'FRONTEND_CONTAINER=$(docker compose -f ../docker-compose.resolved.yml ps -q frontend)

          docker cp "$FRONTEND_CONTAINER":/app/.next/static .next-static-coverage

          '
      - name: Discover the complete unsharded smoke suite
        if: matrix.suite == 'smoke'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: smoke-inventory.json
        run: pnpm exec playwright test --config playwright.config.ts --list --reporter=json --retries=0
      - name: Verify the complete suite before publishing a fresh seed
        id: e2e-seed-suite
        if:
          matrix.seed && env.WRITE_BUILD_CACHE == 'true' && steps.e2e-seed-create.outcome == 'success' && steps.e2e-seed-create.outputs.publishable
          == 'true' && steps.e2e-seed-verify.outcome == 'success'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: smoke-seed-verification.json
          PLAYWRIGHT_RETRIES: "0"
          PLAYWRIGHT_CHANGELOG_FIXTURE: "true"
          PLAYWRIGHT_WORKERS: "4"
        run:
          "pnpm exec playwright test --config playwright.config.ts --retries=0 \\\n  --reporter=json --output=\"\
          $RUNNER_TEMP/seed-smoke-output\"\npython3 ../../.github/scripts/verify_smoke_shards.py seed \\\n  smoke-inventory.json\
          \ smoke-seed-verification.json\n"
      - name: Run Playwright E2E suite
        id: e2e-playwright
        run:
          pnpm exec playwright test src/playwright/journeys/signup-onboarding-first-journey.spec.ts --config
          playwright.journeys.config.ts --project hosted --repeat-each=6 --workers=2 --retries=0 --trace=retain-on-failure
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
          PLAYWRIGHT_RETRIES: "0"
          PLAYWRIGHT_CHANGELOG_FIXTURE: "true"
          PLAYWRIGHT_WORKERS: "2"
          PLAYWRIGHT_JOURNEY_COST_PER_NODE: ${{ matrix.hosted && '1' || '' }}
          PLAYWRIGHT_JOURNEY_TIER: ${{ matrix.hosted && 'PRO' || '' }}
      - name: Validate Playwright JSON report
        id: e2e-playwright-report
        if: ${{ always() }}
        run:
          python ../../.github/scripts/validate_playwright_json.py --synthesize-invalid --min-tests ${{ matrix.min_tests
          }} ${{ matrix.known_failures && '--allow-known-failures' || '' }} test-results/results.json
      - name: Validate coverage report
        id: validate-e2e-coverage
        if: ${{ always() }}
        run: python ../../.github/scripts/validate_cobertura.py coverage/e2e/cobertura-coverage.xml
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name:
            playwright-report-${{ matrix.suite }}${{ matrix.suite == 'smoke' && format('-{0}', matrix.partition)
            || '' }}-hydration-diagnostic
          path: autogpt_platform/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name:
            playwright-test-results-${{ matrix.suite }}${{ matrix.suite == 'smoke' && format('-{0}', matrix.partition)
            || '' }}-hydration-diagnostic
          path: "autogpt_platform/frontend/test-results

            autogpt_platform/frontend/smoke-inventory.json

            autogpt_platform/frontend/smoke-seed-verification.json

            autogpt_platform/frontend/coverage/e2e/cobertura-coverage.xml

            "
          if-no-files-found: error
          retention-days: 3
      - name: Print Final Docker Compose logs
        if: always()
        run: docker compose -f ../docker-compose.resolved.yml logs
    timeout-minutes: 35
