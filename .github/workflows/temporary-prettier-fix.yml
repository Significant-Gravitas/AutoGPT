name: Temporary prettier fix

on:
  push:
    branches:
      - fix/autopilot-phantom-output-edges
    paths:
      - .github/workflows/temporary-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autopilot-phantom-output-edges
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: autogpt_platform/frontend
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier formatting
        working-directory: autogpt_platform/frontend
        run: pnpm exec prettier --write 'src/app/(platform)/build/components/FlowEditor/nodes/OutputHandler.tsx'
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'autogpt_platform/frontend/src/app/(platform)/build/components/FlowEditor/nodes/OutputHandler.tsx'
          git diff --cached --check
          git commit -m "fix(builder): apply canonical frontend formatting"
          git push origin HEAD:fix/autopilot-phantom-output-edges
