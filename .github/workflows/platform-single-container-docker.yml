name: AutoGPT Platform - Single-container image

on:
  push:
    branches: [dev]
    paths:
      - ".dockerignore"
      - ".github/scripts/platform-single-container-smoke.sh"
      - ".github/workflows/platform-single-container-docker.yml"
      - "autogpt_platform/**"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/scripts/platform-single-container-smoke.sh"
      - ".github/workflows/platform-single-container-docker.yml"
      - "autogpt_platform/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a dev release or this PR branch's canary image to Docker Hub"
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEPLOY_IMAGE: docker.io/significantgravitas/autogpt

jobs:
  build-and-scan:
    name: Build, smoke, and scan (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test appliance runtime helpers
        shell: bash
        run: python3 -m unittest discover -s autogpt_platform/single-container/tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: |
            image=docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2

      - name: Build image without publishing
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: autogpt_platform/single-container/docker-bake.hcl
          targets: single-container
          set: |
            *.platform=${{ matrix.platform }}
            backend-server.cache-from=type=gha,scope=platform-single-container-backend-${{ matrix.suffix }}
            backend-server.cache-to=type=gha,scope=platform-single-container-backend-${{ matrix.suffix }},mode=max,ignore-error=true
            single-container.args.IMAGE_VERSION=sha-${{ github.sha }}
            single-container.args.VCS_REF=${{ github.sha }}
            single-container.cache-from=type=gha,scope=platform-single-container-${{ matrix.suffix }}
            single-container.cache-to=type=gha,scope=platform-single-container-${{ matrix.suffix }},mode=max,ignore-error=true
            single-container.output=type=docker
            single-container.tags=autogpt-platform-single-container:ci-${{ matrix.suffix }}

      - name: Smoke-test the complete image
        shell: bash
        env:
          SMOKE_IMAGE: autogpt-platform-single-container:ci-${{ matrix.suffix }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/platform-single-container-smoke.sh

      - name: Scan for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autogpt-platform-single-container:ci-${{ matrix.suffix }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          timeout: 30m

      - name: Scan image filesystem for embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autogpt-platform-single-container:ci-${{ matrix.suffix }}
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 30m

  publish-platform-digests:
    name: Publish, smoke, and scan (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/codex/single-container-publish') && needs.build-and-scan.result == 'success' }}
    needs: build-and-scan
    environment: dockerhub-publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: |
            image=docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push platform digest
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: autogpt_platform/single-container/docker-bake.hcl
          targets: single-container
          set: |
            *.platform=${{ matrix.platform }}
            backend-server.cache-from=type=gha,scope=platform-single-container-backend-${{ matrix.suffix }}
            backend-server.cache-to=type=gha,scope=platform-single-container-backend-${{ matrix.suffix }},mode=max,ignore-error=true
            single-container.args.IMAGE_VERSION=sha-${{ github.sha }}
            single-container.args.VCS_REF=${{ github.sha }}
            single-container.cache-from=type=gha,scope=platform-single-container-${{ matrix.suffix }}
            single-container.cache-to=type=gha,scope=platform-single-container-${{ matrix.suffix }},mode=max,ignore-error=true
            single-container.tags=${{ env.DEPLOY_IMAGE }}
            single-container.attest=type=provenance,mode=max
            single-container.attest=type=sbom
            single-container.output=type=image,name=${{ env.DEPLOY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Capture pushed digest
        id: digest
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          digest="$(jq -er '."single-container"."containerimage.digest"' <<<"$BUILD_METADATA")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return a valid sha256 digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pull the exact pushed digest
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: docker pull --platform "${{ matrix.platform }}" "${DEPLOY_IMAGE}@${DIGEST}"

      - name: Smoke-test the exact pushed digest
        shell: bash
        env:
          SMOKE_IMAGE: ${{ env.DEPLOY_IMAGE }}@${{ steps.digest.outputs.digest }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/platform-single-container-smoke.sh

      - name: Scan the exact pushed digest for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.DEPLOY_IMAGE }}@${{ steps.digest.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          timeout: 30m

      - name: Scan the exact pushed digest for embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.DEPLOY_IMAGE }}@${{ steps.digest.outputs.digest }}
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 30m

      - name: Export verified digest
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/platform-single-container-publish-digests
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          digest_hex="${DIGEST#sha256:}"
          [[ "$digest_hex" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$DIGEST_DIR"
          # Artifact names carry the platform and verified digest between jobs.
          touch "${DIGEST_DIR}/${PLATFORM_SUFFIX}-${digest_hex}"

      - name: Upload verified digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-single-container-publish-digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/platform-single-container-publish-digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-manifest:
    name: Publish multi-platform manifest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/codex/single-container-publish') && needs.publish-platform-digests.result == 'success' }}
    needs: publish-platform-digests
    environment: dockerhub-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download verified digests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: platform-single-container-publish-digest-*
          path: ${{ runner.temp }}/platform-single-container-publish-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: |
            image=docker.io/moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub repository is public
        shell: bash
        run: |
          set -euo pipefail
          repository_metadata="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              https://hub.docker.com/v2/repositories/significantgravitas/autogpt/
          )"
          if ! jq -e '
            .namespace == "significantgravitas"
            and .name == "autogpt"
            and .is_private == false
          ' <<<"$repository_metadata" >/dev/null; then
            echo "Docker Hub repository significantgravitas/autogpt must be public" >&2
            exit 1
          fi

      - name: Publish and verify manifest
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/platform-single-container-publish-digests
          MANIFEST_METADATA: ${{ runner.temp }}/platform-single-container-manifest.json
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$DIGEST_DIR" -maxdepth 1 -type f -print | sort)
          if (( ${#digest_files[@]} != 2 )); then
            echo "expected exactly two verified platform digests" >&2
            exit 1
          fi

          declare -A seen_platforms=()
          image_refs=()
          for digest_file in "${digest_files[@]}"; do
            descriptor="$(basename "$digest_file")"
            # Producer writes <arch>-<digest>; reject any other cross-job input.
            if [[ ! "$descriptor" =~ ^(amd64|arm64)-([0-9a-f]{64})$ ]]; then
              echo "invalid digest artifact name: $descriptor" >&2
              exit 1
            fi
            expected_arch="${BASH_REMATCH[1]}"
            digest_hex="${BASH_REMATCH[2]}"
            if [[ -n "${seen_platforms[$expected_arch]:-}" ]]; then
              echo "duplicate digest for linux/${expected_arch}" >&2
              exit 1
            fi
            seen_platforms[$expected_arch]=1
            image_ref="${DEPLOY_IMAGE}@sha256:${digest_hex}"
            actual_platform="$(
              docker buildx imagetools inspect "$image_ref" --format '{{json .Image}}' |
                jq -er '
                  if has("os") and has("architecture") then
                    "\(.os)/\(.architecture)"
                  else
                    to_entries
                    | map(select(.value.os? != null and .value.architecture? != null))
                    | if length == 1 then
                        "\(.[0].value.os)/\(.[0].value.architecture)"
                      else
                        error("expected exactly one runnable platform")
                      end
                  end
                '
            )"
            if [[ "$actual_platform" != "linux/${expected_arch}" ]]; then
              echo "$image_ref is $actual_platform, expected linux/${expected_arch}" >&2
              exit 1
            fi
            image_refs+=("$image_ref")
          done
          if [[ -z "${seen_platforms[amd64]:-}" || -z "${seen_platforms[arm64]:-}" ]]; then
            echo "both linux/amd64 and linux/arm64 digests are required" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            immutable_ref="${DEPLOY_IMAGE}:sha-${GITHUB_SHA}"
            publish_latest=true
            publication_name="Single-container image published"
          elif [[ "$GITHUB_REF" == "refs/heads/codex/single-container-publish" ]]; then
            immutable_ref="${DEPLOY_IMAGE}:canary-sha-${GITHUB_SHA}"
            publish_latest=false
            publication_name="Single-container PR canary published"
          else
            echo "refusing to publish from $GITHUB_REF" >&2
            exit 1
          fi

          # Workflow concurrency serializes this guard; registry policy covers external writers.
          set +e
          inspect_output="$(docker buildx imagetools inspect "$immutable_ref" 2>&1)"
          inspect_status=$?
          set -e
          if (( inspect_status == 0 )); then
            echo "refusing to overwrite immutable tag $immutable_ref" >&2
            exit 1
          fi
          if ! grep -Eqi '(manifest unknown|not found)' <<<"$inspect_output"; then
            echo "could not prove that $immutable_ref is absent" >&2
            printf '%s\n' "$inspect_output" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --metadata-file "$MANIFEST_METADATA" \
            --tag "$immutable_ref" \
            "${image_refs[@]}"
          manifest_digest="$(jq -er '."containerimage.descriptor".digest' "$MANIFEST_METADATA")"
          if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "manifest creation did not return a valid sha256 digest" >&2
            exit 1
          fi
          resolved_immutable_digest="$(
            docker buildx imagetools inspect "$immutable_ref" --format '{{json .Manifest.Digest}}' |
              jq -er .
          )"
          if [[ "$resolved_immutable_digest" != "$manifest_digest" ]]; then
            echo "immutable tag resolved to an unexpected digest" >&2
            exit 1
          fi
          # Attestations use unknown/unknown and are not runnable platforms.
          if ! docker buildx imagetools inspect --raw "$immutable_ref" |
            jq -e '
              [
                .manifests[]
                | select(
                    ((.annotations // {})["vnd.docker.reference.type"] // "") != "attestation-manifest"
                    and (.platform.os // "unknown") != "unknown"
                    and (.platform.architecture // "unknown") != "unknown"
                  )
                | "\(.platform.os)/\(.platform.architecture)"
              ]
              | sort == ["linux/amd64", "linux/arm64"]
            ' >/dev/null; then
            echo "published manifest does not contain exactly linux/amd64 and linux/arm64" >&2
            exit 1
          fi

          if [[ "$publish_latest" == true ]]; then
            latest_ref="${DEPLOY_IMAGE}:latest"
            docker buildx imagetools create --tag "$latest_ref" "${DEPLOY_IMAGE}@${manifest_digest}"
            resolved_latest_digest="$(
              docker buildx imagetools inspect "$latest_ref" --format '{{json .Manifest.Digest}}' |
                jq -er .
            )"
            if [[ "$resolved_latest_digest" != "$manifest_digest" ]]; then
              echo "latest did not resolve to the verified manifest digest" >&2
              exit 1
            fi
          fi

          {
            echo "## $publication_name"
            echo
            echo "\`${immutable_ref}\`"
            if [[ "$publish_latest" == true ]]; then
              echo "\`${latest_ref}\`"
            else
              echo "\`latest\` was not changed"
            fi
            echo
            echo "Digest: \`${manifest_digest}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
