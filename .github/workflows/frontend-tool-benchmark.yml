name: Icon import diagnostic

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Comparison to run
        type: choice
        options: [tools-and-tests, builds]
        default: tools-and-tests
  push:
    branches: [dev, master]
    paths:
      - ".github/workflows/frontend-tool-benchmark.yml"
      - "autogpt_platform/frontend/package.json"
      - "autogpt_platform/frontend/pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: frontend-tool-benchmark-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/frontend

jobs:
  builds:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark == 'builds'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        first: [baseline, direct]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - name: Prepare the same client and assets as the Docker build
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm generate:api
          pnpm run copy:vad-assets
          cp .env.default .env
      - name: Test build measurement safeguards
        run: python3 -m unittest discover -s ../../.github/scripts -p test_frontend_build_benchmark.py
      - name: Lint build measurement helpers
        run: |
          version=$(python3 ../../.github/workflows/scripts/get_package_version_from_lockfile.py ruff ../backend/poetry.lock)
          pipx run --spec "ruff==$version" ruff check --select E4,E7,E9,F,I \
            ../../.github/scripts/benchmark_frontend_builds.py ../../.github/scripts/test_frontend_build_benchmark.py
      - name: Compare baseline and direct icon imports on one runner
        run: python3 ../../.github/scripts/benchmark_icon_imports.py
        env:
          CI: "true"
          IMPORTS_FIRST: ${{ matrix.first }}
          NODE_ENV: production
          NEXT_PUBLIC_PW_TEST: "true"
          NEXT_PUBLIC_SOURCEMAPS: "true"
          NEXT_SKIP_BUILD_CHECKS: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Upload build timings and output inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-import-benchmark-${{ matrix.first }}-first
          path: ${{ runner.temp }}/icon-import-report
          if-no-files-found: error
