name: AutoGPT Platform - Native iOS

on:
  pull_request:
    paths:
      - "autogpt_platform/mobile/**"
      - ".github/workflows/platform-native-ios-ci.yml"
  push:
    branches: [dev, master]
    paths:
      - "autogpt_platform/mobile/**"
      - ".github/workflows/platform-native-ios-ci.yml"
  workflow_dispatch:
    inputs:
      cold_cache:
        type: boolean
        default: false
        description: Measure without restoring dependency caches
  merge_group:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: native source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: autogpt_platform/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/mobile/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: autogpt_platform/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types

  ios:
    name: iOS build and launch journey
    runs-on: macos-26
    timeout-minutes: 10
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAESTRO_VERSION: "2.11.0"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    defaults:
      run:
        working-directory: autogpt_platform/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: autogpt_platform/mobile/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Record environment and cache paths
        id: environment
        run: |
          mkdir -p e2e/artifacts
          echo "pnpm-store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          xcodebuild -version | tee e2e/artifacts/toolchain.txt
          df -h . | tee e2e/artifacts/disk-before.txt

      - name: Restore JavaScript dependencies
        id: javascript-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.environment.outputs.pnpm-store }}
          key: native-ios-pnpm-macos-26-${{ hashFiles('autogpt_platform/mobile/pnpm-lock.yaml') }}

      - name: Install dependencies and generate iOS project
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm prebuild:ios

      - name: Restore CocoaPods after generating the native project
        id: pods-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            autogpt_platform/mobile/ios/Pods
            autogpt_platform/mobile/ios/Podfile.lock
          key: native-ios-pods-macos-26-xcode-26.6-${{ hashFiles('autogpt_platform/mobile/pnpm-lock.yaml', 'autogpt_platform/mobile/app.config.ts') }}

      - name: Install CocoaPods
        run: |
          (cd ios && pod install) > e2e/artifacts/pods.log 2>&1 || { tail -100 e2e/artifacts/pods.log; exit 1; }

      - name: Build simulator app
        id: build
        run: |
          /usr/bin/time -l xcodebuild \
            -workspace ios/AutoGPT.xcworkspace -scheme AutoGPT \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData -jobs 3 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
            COMPILER_INDEX_STORE_ENABLE=NO build > e2e/artifacts/xcodebuild.log 2>&1 \
            || { tail -100 e2e/artifacts/xcodebuild.log; exit 1; }
          ditto -c -k --keepParent .build/DerivedData/Build/Products/Release-iphonesimulator/AutoGPT.app e2e/artifacts/AutoGPT-simulator.zip

      - name: Install Maestro and launch simulator
        run: |
          maestro_dir="$RUNNER_TEMP/native-maestro"
          mkdir -p "$maestro_dir"
          curl --fail --location --retry 2 "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" -o "$maestro_dir/maestro.zip"
          curl --fail --location --retry 2 "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/checksums_sha256.txt" -o "$maestro_dir/checksums_sha256.txt"
          (cd "$maestro_dir" && shasum -a 256 -c checksums_sha256.txt && unzip -q maestro.zip)
          echo "$maestro_dir/maestro/bin" >> "$GITHUB_PATH"
          xcrun simctl list devices available --json > e2e/artifacts/devices.json
          device_id=$(python3 scripts/select-simulator.py e2e/artifacts/devices.json)
          echo "NATIVE_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" .build/DerivedData/Build/Products/Release-iphonesimulator/AutoGPT.app

      - name: Run native launch journey
        run: |
          maestro --device "$NATIVE_SIMULATOR_ID" test --format junit \
            --output e2e/artifacts/launch.xml --test-output-dir e2e/artifacts/maestro e2e/launch.yaml
          python3 scripts/check-junit.py e2e/artifacts/launch.xml

      - name: Record measurement scope
        if: always()
        env:
          JAVASCRIPT_CACHE_HIT: ${{ steps.javascript-cache.outputs.cache-hit }}
          PODS_CACHE_HIT: ${{ steps.pods-cache.outputs.cache-hit }}
        run: |
          df -h . | tee e2e/artifacts/disk-after.txt
          {
            echo 'Standard free macos-26 runner; Xcode 26.6; arm64 simulator.'
            echo "JavaScript cache hit: ${JAVASCRIPT_CACHE_HIT:-false}"
            echo "CocoaPods cache hit: ${PODS_CACHE_HIT:-false}"
            echo 'Use full job timestamps, including setup and upload, for the ten-minute budget.'
            echo 'This launch journey is the first build gate, not the complete native/server integration gate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios-evidence
          path: autogpt_platform/mobile/e2e/artifacts
          retention-days: 7
          if-no-files-found: error
