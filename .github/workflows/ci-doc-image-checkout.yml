name: Paired backend checkout without documentation images
permissions:
  contents: read
jobs:
  compare:
    name: Docs image checkout (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order:
        - whole-first
        - sparse-first
    steps:
    - name: Start checkout 1
      run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
    - name: Checkout 1
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 5458782482a0a71ed9472f2e1759b17d971215f7
        path: checkout-1
        filter: blob:none
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ matrix.order == 'sparse-first' && format('/*{0}!/docs/platform/.gitbook/assets/',
          fromJSON('"\n"')) || '' }}
        submodules: true
    - name: Measure checkout 1 and verify all other source files
      env:
        MODE: ${{ matrix.order == 'sparse-first' && 'sparse' || 'whole' }}
      working-directory: checkout-1
      run: 'elapsed=$(($(date +%s)-BENCHMARK_STARTED))

        echo "::notice title=checkout-comparison::{\"order\":\"${{ matrix.order }}\",\"mode\":\"$MODE\",\"seconds\":$elapsed}"

        git count-objects -v

        python3 - <<''PY''

        import os, pathlib, subprocess

        files = set(subprocess.check_output([''git'', ''ls-files'', ''-z'']).decode().split(''\0'')) -
        {''''}

        allowed = {p for p in files if p.startswith(''docs/platform/.gitbook/assets/'')}

        assert len(allowed) == 43

        assert all(pathlib.Path(p).suffix in {''.png'', ''.gif''} for p in allowed)

        missing = {p for p in files if not pathlib.Path(p).exists() and not pathlib.Path(p).is_symlink()}

        assert missing == (allowed if os.environ[''MODE''] == ''sparse'' else set()), sorted(missing)

        print(''All application code, tests, fixtures and other documentation retained'')

        PY

        '
    - name: Start checkout 2
      run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
    - name: Checkout 2
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 5458782482a0a71ed9472f2e1759b17d971215f7
        path: checkout-2
        filter: blob:none
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ matrix.order == 'whole-first' && format('/*{0}!/docs/platform/.gitbook/assets/',
          fromJSON('"\n"')) || '' }}
        submodules: true
    - name: Measure checkout 2 and verify all other source files
      env:
        MODE: ${{ matrix.order == 'whole-first' && 'sparse' || 'whole' }}
      working-directory: checkout-2
      run: 'elapsed=$(($(date +%s)-BENCHMARK_STARTED))

        echo "::notice title=checkout-comparison::{\"order\":\"${{ matrix.order }}\",\"mode\":\"$MODE\",\"seconds\":$elapsed}"

        git count-objects -v

        python3 - <<''PY''

        import os, pathlib, subprocess

        files = set(subprocess.check_output([''git'', ''ls-files'', ''-z'']).decode().split(''\0'')) -
        {''''}

        allowed = {p for p in files if p.startswith(''docs/platform/.gitbook/assets/'')}

        assert len(allowed) == 43

        assert all(pathlib.Path(p).suffix in {''.png'', ''.gif''} for p in allowed)

        missing = {p for p in files if not pathlib.Path(p).exists() and not pathlib.Path(p).is_symlink()}

        assert missing == (allowed if os.environ[''MODE''] == ''sparse'' else set()), sorted(missing)

        print(''All application code, tests, fixtures and other documentation retained'')

        PY

        '
'on':
  push:
    branches:
    - codex/ci-doc-image-checkout-20261103-1813
