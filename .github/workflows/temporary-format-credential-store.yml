name: Temporary format credential store

on:
  push:
    branches: [fix-ollama-credentials]
    paths:
      - .github/workflows/temporary-format-credential-store.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-ollama-credentials

      - name: Add method separator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("autogpt_platform/backend/backend/integrations/credentials_store.py")
          text = path.read_text()
          old = "        return next((c for c in all_credentials if c.id == credentials_id), None)\n    async def get_creds_by_provider("
          new = "        return next((c for c in all_credentials if c.id == credentials_id), None)\n\n    async def get_creds_by_provider("
          if old not in text:
              raise SystemExit("method separator target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile autogpt_platform/backend/backend/integrations/credentials_store.py

      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/temporary-format-credential-store.yml
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add autogpt_platform/backend/backend/integrations/credentials_store.py .github/workflows/temporary-format-credential-store.yml
          git diff --cached --check
          git commit -m "style(platform/llm): separate credential store methods"
          git push origin HEAD:fix-ollama-credentials
