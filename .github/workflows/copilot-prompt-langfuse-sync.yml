name: AutoGPT Platform - CoPilot prompt Langfuse sync

# Keeps the "CoPilot Prompt" in Langfuse in step with
# backend/copilot/service.py::_CACHEABLE_SYSTEM_PROMPT.
#   pull_request -> the script's tests only; no Langfuse keys, so PR code never sees them
#   push to dev  -> --publish-latest
#   push master  -> --promote-production
#
# The keys live only in the `copilot-prompt-sync` environment, whose deployment
# branches must be limited to dev and master, and are passed only to the step
# that syncs, never to installers or the job as a whole.
on:
  pull_request:
    branches: [master, dev]
    paths:
      - ".github/workflows/copilot-prompt-langfuse-sync.yml"
      - "autogpt_platform/backend/backend/copilot/service.py"
      - "autogpt_platform/backend/backend/copilot/config.py"
      - "autogpt_platform/backend/scripts/sync_copilot_prompt_to_langfuse.py"
      - "autogpt_platform/backend/scripts/sync_copilot_prompt_to_langfuse_test.py"
  push:
    branches: [master, dev]
    paths:
      - ".github/workflows/copilot-prompt-langfuse-sync.yml"
      - "autogpt_platform/backend/backend/copilot/service.py"
      - "autogpt_platform/backend/backend/copilot/config.py"
      - "autogpt_platform/backend/scripts/sync_copilot_prompt_to_langfuse.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "check is read-only; publish-latest runs on dev; promote-production on master"
        required: true
        default: check
        type: choice
        options: [check, publish-latest, promote-production]

permissions:
  contents: read

# Writes share one group so two runs never touch Langfuse at once, and queue
# instead of replacing each other: with the default single pending slot a dev
# push would cancel a master promotion still waiting for its turn. A PR check
# gets its own group. queue: max cannot be combined with cancel-in-progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('copilot-prompt-check-{0}', github.event.pull_request.number) || 'copilot-prompt-langfuse-write' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/backend

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Install Python dependencies
        run: poetry install

      - name: Generate Prisma client
        run: poetry run prisma generate

      - name: Test the sync script
        run: poetry run pytest scripts/sync_copilot_prompt_to_langfuse_test.py -q

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: copilot-prompt-sync
    steps:
      - name: Pick mode
        id: mode
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT" in
            push) [ "$REF" = "refs/heads/master" ] && mode=promote-production || mode=publish-latest ;;
            workflow_dispatch) mode="$INPUT_MODE" ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          case "$mode:$REF" in
            check:refs/heads/dev|check:refs/heads/master) ;;
            publish-latest:refs/heads/dev) ;;
            promote-production:refs/heads/master) ;;
            *) echo "::error::$mode is not allowed on $REF"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Passes only whether the keys are set, never their values, so a run
      # before they are added skips green instead of failing.
      - name: Check Langfuse keys
        id: keys
        working-directory: .
        env:
          HAS_KEYS: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' && secrets.LANGFUSE_SECRET_KEY != '' }}
        run: |
          if [ "$HAS_KEYS" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY are not set in the copilot-prompt-sync environment; skipping the Langfuse sync"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.keys.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.keys.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        if: steps.keys.outputs.present == 'true'
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Install Python dependencies
        if: steps.keys.outputs.present == 'true'
        run: poetry install

      # Importing backend.copilot.service pulls in prisma.models; generating the
      # client needs no database.
      - name: Generate Prisma client
        if: steps.keys.outputs.present == 'true'
        run: poetry run prisma generate

      # The only step that gets the keys.
      - name: Sync prompt
        if: steps.keys.outputs.present == 'true'
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: poetry run python -m scripts.sync_copilot_prompt_to_langfuse "--$MODE"
