name: Temporary isolated Ollama checks

on:
  push:
    branches: [fix-ollama-credentials]
    paths:
      - .github/workflows/temporary-validate-ollama-quick.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/backend
    env:
      CI: true
      PLAIN_OUTPUT: True
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ollama-credentials
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -
      - name: Install dependencies
        run: poetry install
      - name: Run isolated no-auth credential tests
        run: poetry run pytest --confcutdir=backend/executor backend/executor/no_auth_credentials_test.py -q
      - name: Verify block documentation sync
        run: poetry run python scripts/generate_block_docs.py --check
      - name: Remove temporary validation workflows
        working-directory: .
        run: |
          rm -f .github/workflows/temporary-validate-ollama-final.yml
          rm -f .github/workflows/temporary-validate-ollama-quick.yml
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary Ollama validation workflows"
          git push origin HEAD:fix-ollama-credentials
