name: Temporary fix credentials test fixture

on:
  push:
    branches: [fix-ollama-credentials]
    paths:
      - .github/workflows/temporary-fix-credentials-test.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-ollama-credentials

      - name: Patch schema fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("autogpt_platform/frontend/src/components/contextual/CredentialsInput/__tests__/CredentialsInput.test.tsx")
          text = path.read_text()

          old_base = '''const baseSchema: BlockIOCredentialsSubSchema = {
            credentials_provider: ["google"],
            credentials_types: ["oauth2"],
            credentials_scopes: ["drive.file", "drive.metadata"],
          } as BlockIOCredentialsSubSchema;'''
          new_base = '''const baseSchema: BlockIOCredentialsSubSchema = {
            type: "object",
            properties: {},
            credentials_provider: ["google"],
            credentials_types: ["oauth2"],
            credentials_scopes: ["drive.file", "drive.metadata"],
          };'''

          old_ollama = '''    const ollamaSchema = {
                credentials_provider: ["ollama"],
                credentials_types: [],
                credentials_scopes: [],
              } as BlockIOCredentialsSubSchema;'''
          new_ollama = '''    const ollamaSchema: BlockIOCredentialsSubSchema = {
                type: "object",
                properties: {},
                credentials_provider: ["ollama"],
                credentials_types: [],
                credentials_scopes: [],
              };'''

          if old_base not in text:
              raise SystemExit("base schema fixture not found")
          if old_ollama not in text:
              raise SystemExit("Ollama schema fixture not found")

          path.write_text(text.replace(old_base, new_base).replace(old_ollama, new_ollama))
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-credentials-test.yml
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add autogpt_platform/frontend/src/components/contextual/CredentialsInput/__tests__/CredentialsInput.test.tsx .github/workflows/temporary-fix-credentials-test.yml
          git diff --cached --check
          git commit -m "test(platform/frontend): use complete credential schema fixtures"
          git push origin HEAD:fix-ollama-credentials
