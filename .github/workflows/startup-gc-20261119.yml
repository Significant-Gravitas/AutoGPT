name: Compare Python startup garbage collection
'on':
  push:
    branches:
    - codex/ci-startup-gc-20261119
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/backend
jobs:
  compare:
    name: Startup GC (${{ matrix.python-version }}, ${{ matrix.order }})
    permissions:
      contents: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        test-shard:
        - util-executor
        partition:
        - 0
        order:
        - baseline-first
        - candidate-first
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1.4
        ports:
        - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_DEFAULT_PASS }}
        options: --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval 30s --health-timeout
          10s --health-retries 5 --health-start-period 10s
      clamav:
        image: clamav/clamav-debian:1.5.4
        ports:
        - 3310:3310
        env:
          CLAMAV_NO_FRESHCLAMD: false
          CLAMD_CONF_StreamMaxLength: 256M
          CLAMD_CONF_MaxFileSize: 256M
          CLAMD_CONF_MaxScanSize: 1024M
          CLAMD_CONF_PCREMaxFileSize: 256M
          CLAMD_CONF_AlertExceedsMax: 'yes'
          CLAMD_CONF_MaxScanTime: 300000
          CLAMD_CONF_MaxThreads: 4
          CLAMD_CONF_ReadTimeout: 300
        options: --health-cmd "clamdscan --version || exit 1" --health-interval 30s --health-timeout 10s
          --health-retries 5 --health-start-period 180s
      falkordb:
        image: falkordb/falkordb:v4.12.5
        ports:
        - 6380:6379
        env:
          REDIS_ARGS: --requirepass ci-${{ github.run_id }}-${{ github.run_attempt }}
        options: --health-cmd "redis-cli -a ci-${{ github.run_id }}-${{ github.run_attempt }} ping ||
          exit 1" --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period
          10s
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        filter: blob:none
        submodules: true
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/docs/platform/.gitbook/assets/*.png
          !/docs/platform/.gitbook/assets/*.gif
    - name: Verify application source and test fixtures are present
      working-directory: .
      run: python3 .github/scripts/validate_ci_checkout.py
    - name: Checkout skills catalog
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: Significant-Gravitas/skills-catalog
        ref: a5dc0724d9d3b51448d59eb89bf64568cb83178a
        path: skills-catalog
        persist-credentials: false
    - name: Configure test shard
      shell: bash
      env:
        MATRIX_TEST_SHARD: ${{ matrix.test-shard }}
        MATRIX_TEST_PARTITION: ${{ matrix.partition }}
      run: "# The trial tests' safety guard only accepts localhost:5432/postgres\n# under GITHUB_ACTIONS,\
        \ and the per-shard names are cosmetic anyway \u2014\n# each shard already has its own runner\
        \ and its own Postgres container.\ncase \"$MATRIX_TEST_SHARD\" in\n  data)\n    database_name=\"\
        postgres\"\n    ;;\n  copilot|memory-experts|sdk-billing|billing-threads|util-executor|api|remainder)\n\
        \    database_name=\"ci_${MATRIX_TEST_SHARD//-/_}\"\n    ;;\n  *)\n    echo \"Unknown backend\
        \ test shard: $MATRIX_TEST_SHARD\" >&2\n    exit 1\n    ;;\nesac\n\n{\n  echo \"TEST_SHARD=${MATRIX_TEST_SHARD}-${MATRIX_TEST_PARTITION}\"\
        \n  echo \"DATABASE_NAME=${database_name}\"\n  echo \"RABBITMQ_VHOST=ci-${MATRIX_TEST_SHARD}\"\
        \n  echo \"REDIS_PORT=17000\"\n} >> \"$GITHUB_ENV\"\n"
    - name: Start isolated stateful services
      id: stateful-services
      working-directory: autogpt_platform
      background: true
      env:
        CLAMAV_CONTAINER: ${{ job.services.clamav.id }}
        RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
      run: |
        postgres_image=pgvector/pgvector:pg15
        bash "$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh" "$postgres_image"
        docker run --pull=never -d --name postgres-test \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=postgres \
          -p 5432:5432 \
          -v "$(pwd)/db/init/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro" \
          "$postgres_image"

        postgres_ready=false
        for _ in $(seq 1 30); do
          if docker exec postgres-test pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
            postgres_ready=true
            break
          fi
          sleep 1
        done
        if [[ "$postgres_ready" != "true" ]]; then
          echo "Postgres failed to start" >&2
          docker logs postgres-test >&2
          exit 1
        fi

        # The container's entrypoint already created and initialised `postgres`.
        if [[ "$DATABASE_NAME" != "postgres" ]]; then
          docker exec postgres-test createdb -h 127.0.0.1 -U postgres "$DATABASE_NAME"
          docker exec postgres-test psql -h 127.0.0.1 -U postgres \
            -v ON_ERROR_STOP=1 -d "$DATABASE_NAME" \
            -f /docker-entrypoint-initdb.d/00-init.sql
        fi

        if [[ -z "$RABBITMQ_CONTAINER" ]]; then
          echo "RabbitMQ service container was not found" >&2
          exit 1
        fi
        docker exec "$RABBITMQ_CONTAINER" rabbitmqctl add_vhost "$RABBITMQ_VHOST"
        docker exec "$RABBITMQ_CONTAINER" rabbitmqctl set_permissions \
          -p "$RABBITMQ_VHOST" "$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"

        start_redis_cluster() {
          local name="$1"
          local base_port="$2"
          local network="redis-cluster-ci-${name}"
          docker network create "$network"

          for offset in 0 1 2; do
            local port=$((base_port + offset))
            local bus=$((base_port + 10000 + offset))
            local container="redis-${name}-${offset}"
            docker run --pull=never -d --name "$container" --network "$network" \
              --network-alias "$container" \
              -p "$port:$port" \
              "$redis_image" \
              redis-server --port "$port" \
                --cluster-enabled yes \
                --cluster-config-file nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-require-full-coverage no \
                --cluster-announce-hostname "$container" \
                --cluster-announce-port "$port" \
                --cluster-announce-bus-port "$bus" \
                --cluster-preferred-endpoint-type hostname
          done

          for offset in 0 1 2; do
            local port=$((base_port + offset))
            local container="redis-${name}-${offset}"
            local ready=false
            for _ in $(seq 1 30); do
              if docker exec "$container" redis-cli -p "$port" ping 2>/dev/null | grep -q '^PONG$'; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "$container failed to accept commands" >&2
              docker logs "$container" >&2
              return 1
            fi
          done

          docker run --pull=never --rm --network "$network" "$redis_image" \
            redis-cli --cluster create \
              "redis-${name}-0:${base_port}" \
              "redis-${name}-1:$((base_port + 1))" \
              "redis-${name}-2:$((base_port + 2))" \
              --cluster-replicas 0 --cluster-yes

          for _ in $(seq 1 30); do
            local info
            if info=$(docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info); then
              local state
              state=$(printf '%s\n' "$info" | awk -F: '/^cluster_state:/ {print $2}' | tr -d '[:cntrl:]')
              if [[ "$state" == "ok" ]]; then
                echo "Redis cluster ${name} ready on ${base_port}-$((base_port + 2))"
                return 0
              fi
            fi
            sleep 1
          done

          echo "Redis cluster ${name} failed to converge" >&2
          docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info >&2
          return 1
        }

        redis_image=redis:7
        bash "$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh" "$redis_image"
        start_redis_cluster "$TEST_SHARD" "$REDIS_PORT"

        if [[ -z "$CLAMAV_CONTAINER" ]]; then
          echo "ClamAV service container was not found" >&2
          exit 1
        fi
        clamav_ready=false
        for _ in $(seq 1 60); do
          if nc -z localhost 3310; then
            clamav_ready=true
            break
          fi
          sleep 5
        done
        if [[ "$clamav_ready" != "true" ]]; then
          echo "ClamAV failed to start" >&2
          docker logs "$CLAMAV_CONTAINER" >&2
          exit 1
        fi
        if ! timeout 10 bash -c 'echo "PING" | nc localhost 3310'; then
          echo "ClamAV is not responding to PING" >&2
          docker logs "$CLAMAV_CONTAINER" >&2
          exit 1
        fi
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Select Poetry version
      id: poetry-version
      run: |
        # Extract Poetry version from backend/poetry.lock
        HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
        echo "Found Poetry version ${HEAD_POETRY_VERSION} in backend/poetry.lock"

        if [ -n "$BASE_REF" ]; then
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Missing or invalid base commit for ${BASE_REF}" >&2
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules --depth=1 --filter=blob:none origin "$BASE_SHA"
          if ! BASE_LOCK=$(git show "${BASE_SHA}:autogpt_platform/backend/poetry.lock"); then
            echo "Could not read poetry.lock from ${BASE_REF}" >&2
            exit 1
          fi
          BASE_POETRY_VERSION=$(printf '%s\n' "$BASE_LOCK" | python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry -)
          echo "Found Poetry version ${BASE_POETRY_VERSION} in backend/poetry.lock on ${BASE_REF}"
          POETRY_VERSION=$(printf '%s\n' "$HEAD_POETRY_VERSION" "$BASE_POETRY_VERSION" | sort -V | tail -n1)
        else
          POETRY_VERSION=$HEAD_POETRY_VERSION
        fi
        echo "Using Poetry version ${POETRY_VERSION}"

        echo "version=$POETRY_VERSION" >> "$GITHUB_OUTPUT"
      env:
        BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.6
        enable-cache: false
    - name: Install Python dependencies from the Poetry lock
      run: bash ../../.github/scripts/install_backend_ci.sh
      env:
        POETRY_VERSION: ${{ steps.poetry-version.outputs.version }}
        UV_CACHE_DIR: ${{ runner.temp }}/backend-uv-cache
        UV_TOOL_DIR: ${{ runner.temp }}/backend-uv-tools
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/backend-uv-bin
    - name: Generate Prisma Client
      uses: $/.github/actions/generate-prisma-client
    - name: Wait for isolated stateful services
      wait: stateful-services
    - name: Migrate shard database
      run: |
        export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${DATABASE_NAME}"
        export DIRECT_URL="$DATABASE_URL"
        poetry run prisma migrate deploy
    - name: Generate ephemeral secrets
      run: |
        echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
        echo "UNSUBSCRIBE_SECRET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
        echo "INTERNAL_API_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
    - name: Lint and test diagnostic helpers
      run: |-
        poetry run ruff check ../../.github/benchmarks/startup_gc_control.py ../../.github/benchmarks/startup_gc_probe.py ../../.github/benchmarks/test_startup_gc_control.py ../../.github/benchmarks/benchmark_startup_gc_20261119.py
        poetry run black --check ../../.github/benchmarks/startup_gc_control.py ../../.github/benchmarks/startup_gc_probe.py ../../.github/benchmarks/test_startup_gc_control.py ../../.github/benchmarks/benchmark_startup_gc_20261119.py
        poetry run python -m unittest discover -s ../../.github/benchmarks -p test_startup_gc_control.py
    - name: Compare startup GC and validate complete architecture and blocks
      env:
        COVERAGE_FILE: .coverage-${{ matrix.test-shard }}-${{ matrix.partition }}
        PYTHONUNBUFFERED: '1'
        BACKEND_TEST_METRICS: shard-metrics-${{ matrix.test-shard }}-${{ matrix.partition }}.json
        LOG_LEVEL: ${{ runner.debug && 'DEBUG' || 'INFO' }}
        EXECUTION_MANAGER_PORT: '18002'
        DATABASE_API_PORT: '18005'
        AGENT_API_PORT: '18006'
        EXECUTION_SCHEDULER_PORT: '18003'
        NOTIFICATION_SERVICE_PORT: '18007'
        REDIS_HOST: localhost
        GRAPHITI_FALKORDB_HOST: 127.0.0.1
        TRIAL_TEST_DATABASE: '1'
        TEST_LAYOUT: ${{ inputs.test_layout || 'paths' }}
        BENCHMARK_ORDER: ${{ matrix.order }}
      run: |-
        export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${DATABASE_NAME}"
        export DIRECT_URL="$DATABASE_URL"
        nproc
        lscpu | grep -E '^(Architecture|CPU\(s\)|Model name):'
        poetry run python ../../.github/benchmarks/benchmark_startup_gc_20261119.py --order "$BENCHMARK_ORDER"
    - name: Upload timing, memory, coverage and test reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: startup-gc-${{ matrix.python-version }}-${{ matrix.order }}
        path: ${{ runner.temp }}/startup-gc
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    env:
      CI: true
      PLAIN_OUTPUT: true
      RUN_ENV: local
      PORT: 8080
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SKILLS_CATALOG_PATH: ${{ github.workspace }}/skills-catalog
      SKILLS_CATALOG_TOKEN: ${{ github.token }}
      RABBITMQ_DEFAULT_USER: rabbitmq_user_default
      RABBITMQ_DEFAULT_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}
      GRAPHITI_FALKORDB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
