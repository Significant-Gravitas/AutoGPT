name: Temporary Ollama review fixer

on:
  push:
    branches:
      - fix-ollama-credentials
    paths:
      - .github/workflows/temporary-fix-ollama-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ollama-credentials
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if not count:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s) of {old!r}")

          llm = "autogpt_platform/backend/backend/blocks/llm.py"
          replace_once(
              llm,
              '''        discriminator_type_mapping={\n            model.value: [] if model.metadata.provider == ProviderName.OLLAMA else ["api_key"]\n            for model in LLMModel\n        },\n        default=None,\n''',
              '''        discriminator_type_mapping={\n            model.value: (\n                [] if model.metadata.provider == ProviderName.OLLAMA else ["api_key"]\n            )\n            for model in LLMModel\n        },\n''',
          )
          replace_all(llm, "APIKeyCredentials | None", "APIKeyCredentials")
          replace_once(
              llm,
              '''    provider = llm_model.metadata.provider\n    if provider != "ollama" and not credentials:\n        raise ValueError(f"Credentials are required for provider {provider}")\n    context_window = llm_model.context_window\n''',
              '''    provider = llm_model.metadata.provider\n    context_window = llm_model.context_window\n''',
          )
          replace_once(
              llm,
              '''        api_key=credentials.api_key.get_secret_value() if credentials else "",\n''',
              '''        api_key=credentials.api_key.get_secret_value(),\n''',
          )
          replace_once(
              llm,
              '''            placeholder="Enter the prompt here...",\n''',
              '''            placeholder="Enter your prompt here...",\n''',
          )

          orchestrator = "autogpt_platform/backend/backend/blocks/orchestrator.py"
          replace_all(
              orchestrator,
              "llm.APIKeyCredentials | None",
              "llm.APIKeyCredentials",
          )
          replace_once(
              orchestrator,
              '''        if credentials is None or not credentials.api_key:\n            yield (\n                "error",\n                (\n                    "Extended thinking requires direct API credentials and does not "\n                    "support subscription mode. Please provide an Anthropic or OpenRouter API key."\n                ),\n            )\n            return\n        provider = credentials.provider\n''',
              '''        provider = credentials.provider\n        if not credentials.api_key:\n            yield (\n                "error",\n                (\n                    "Extended thinking requires direct API credentials and does not "\n                    "support subscription mode. Please provide an Anthropic or OpenRouter API key."\n                ),\n            )\n            return\n''',
          )

          graph = "autogpt_platform/backend/backend/data/graph.py"
          replace_once(
              graph,
              '''                    discriminated_info = field_info.discriminate(discriminator_value)\n                    discriminated_info.discriminator_values.add(discriminator_value)\n\n                    node_credential_data.append(\n''',
              '''                    discriminated_info = field_info.discriminate(discriminator_value)\n                    if not discriminated_info.supported_types:\n                        # Credential-free discriminator variants (currently Ollama)\n                        # must not create a graph-level credential input. The\n                        # executor supplies the provider's internal no-auth runtime\n                        # adapter instead.\n                        continue\n                    discriminated_info.discriminator_values.add(discriminator_value)\n\n                    node_credential_data.append(\n''',
          )

          manager = "autogpt_platform/backend/backend/executor/manager.py"
          replace_once(
              manager,
              '''from .auto_credentials import acquire_auto_credentials\n''',
              '''from .auto_credentials import acquire_auto_credentials\nfrom .no_auth_credentials import get_no_auth_credentials\n''',
          )
          replace_once(
              manager,
              '''            field_value = input_data.get(field_name)\n            if not field_value or (\n''',
              '''            no_auth_credentials = get_no_auth_credentials(\n                credential_fields_info[field_name], input_data\n            )\n            if no_auth_credentials is not None:\n                # Preserve the normal CredentialsMetaInput shape for block input\n                # validation while avoiding any user-saved credential lookup.\n                input_data[field_name] = {\n                    "id": no_auth_credentials.id,\n                    "provider": no_auth_credentials.provider,\n                    "type": no_auth_credentials.type,\n                    "title": no_auth_credentials.title,\n                }\n                extra_exec_kwargs[field_name] = no_auth_credentials\n                continue\n\n            field_value = input_data.get(field_name)\n            if not field_value or (\n''',
          )

          cost_config = "autogpt_platform/backend/backend/data/block_cost_config.py"
          replace_once(
              cost_config,
              '''            cost_filter={\n                "model": model,\n                "credentials": {\n                    "id": ollama_credentials.id,\n                    "provider": ollama_credentials.provider,\n                    "type": ollama_credentials.type,\n                },\n            },\n''',
              '''            cost_filter={"model": model},\n''',
          )
          replace_once(
              cost_config,
              '''from backend.integrations.credentials_store import (\n''',
              '''from backend.integrations.credentials_store import (\n''',
          )

          credentials_store = "autogpt_platform/backend/backend/integrations/credentials_store.py"
          replace_once(
              credentials_store,
              '''        # These will always be added\n        all_credentials.append(ollama_credentials)\n\n        # These will only be added if the API key is set\n''',
              '''        # Ollama is credential-free. Its internal compatibility credential\n        # is injected only at execution time and must not appear in user settings.\n\n        # These will only be added if the API key is set\n''',
          )

          helper = Path("autogpt_platform/backend/backend/executor/no_auth_credentials.py")
          helper.write_text('''from typing import Any\n\nfrom backend.data.model import APIKeyCredentials, CredentialsFieldInfo\nfrom backend.integrations.credentials_store import ollama_credentials, provider_matches\n\n\ndef get_no_auth_credentials(\n    field_info: CredentialsFieldInfo, input_data: dict[str, Any]\n) -> APIKeyCredentials | None:\n    """Return an internal runtime credential for credential-free variants.\n\n    CredentialsField remains required at the block schema level so providers that\n    require authentication still fail preflight normally. A discriminator variant\n    with no supported credential types is therefore an explicit no-auth contract,\n    not a blanket optional-credentials flag.\n    """\n    if not (field_info.discriminator and field_info.discriminator_mapping):\n        return None\n\n    discriminator_value = input_data.get(field_info.discriminator)\n    if discriminator_value is None:\n        return None\n\n    discriminated_info = field_info.discriminate(discriminator_value)\n    if discriminated_info.supported_types:\n        return None\n\n    provider = next(iter(discriminated_info.provider), None)\n    if provider is not None and provider_matches(str(provider), ollama_credentials.provider):\n        return ollama_credentials\n\n    raise ValueError(\n        f"Credential-free provider {provider!s} has no runtime credential adapter"\n    )\n''')

          test_file = Path(
              "autogpt_platform/backend/backend/executor/no_auth_credentials_test.py"
          )
          test_file.write_text('''from backend.blocks.llm import AITextGeneratorBlock, LLMModel\nfrom backend.executor.no_auth_credentials import get_no_auth_credentials\nfrom backend.integrations.credentials_store import ollama_credentials\nfrom backend.integrations.providers import ProviderName\n\n\ndef _model_for(provider: ProviderName) -> LLMModel:\n    return next(model for model in LLMModel if model.metadata.provider == provider)\n\n\ndef test_ollama_credentials_are_discriminated_as_no_auth() -> None:\n    field_info = AITextGeneratorBlock.Input.get_credentials_fields_info()["credentials"]\n    ollama_model = _model_for(ProviderName.OLLAMA)\n\n    discriminated = field_info.discriminate(ollama_model.value)\n\n    assert not discriminated.supported_types\n    assert "credentials" in AITextGeneratorBlock.Input.get_required_fields()\n    assert get_no_auth_credentials(\n        field_info, {"model": ollama_model.value}\n    ) is ollama_credentials\n\n\ndef test_authenticated_llm_provider_stays_required() -> None:\n    field_info = AITextGeneratorBlock.Input.get_credentials_fields_info()["credentials"]\n    openai_model = _model_for(ProviderName.OPENAI)\n\n    discriminated = field_info.discriminate(openai_model.value)\n\n    assert discriminated.supported_types == frozenset({"api_key"})\n    assert "credentials" in AITextGeneratorBlock.Input.get_required_fields()\n    assert get_no_auth_credentials(field_info, {"model": openai_model.value}) is None\n''')

          workflow = Path(".github/workflows/temporary-fix-ollama-review.yml")
          workflow.unlink()
          PY

      - name: Commit review fixes
        run: |
          git config user.name "Iitian001"
          git config user.email "160615932+Iitian001@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(platform/llm): narrow credential-free handling to Ollama"
          git push origin HEAD:fix-ollama-credentials
