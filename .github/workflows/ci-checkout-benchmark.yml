name: Benchmark CI gate checkout
on:
  push:
    branches: [codex/ci-checkout-benchmark-20261103-1702]
permissions:
  contents: read
jobs:
  checkout:
    name: Gate checkout (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: whole-tree
            paths: ''
          - mode: sparse-helpers
            paths: |
              /.github/
              /autogpt_platform/backend/poetry.lock
    steps:
      - name: Start measurement
        run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out complete history with selected working tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.paths }}
      - name: Record checkout duration
        env:
          MODE: ${{ matrix.mode }}
        run: |
          elapsed=$(($(date +%s)-BENCHMARK_STARTED))
          echo "::notice title=checkout-comparison::{\"mode\":\"$MODE\",\"seconds\":$elapsed}"
          if [[ "$MODE" == sparse-helpers ]]; then
            test ! -d docs
            test ! -d autogpt_platform/frontend
            test -f autogpt_platform/backend/poetry.lock
          fi
      - name: Lint helpers with locked Ruff
        run: |
          version=$(python3 .github/workflows/scripts/get_package_version_from_lockfile.py ruff autogpt_platform/backend/poetry.lock)
          pipx run --spec "ruff==$version" ruff check --select E4,E7,E9,F,I .github/scripts/ci_affected.py .github/scripts/test_ci_affected.py
      - name: Verify all selector contracts including omitted working-tree files
        run: python3 -m unittest discover -s .github/scripts -p test_ci_affected.py -v
