name: Paired CI gate checkout
on:
  push:
    branches: [codex/ci-checkout-benchmark-20261103-1702]
permissions:
  contents: read
jobs:
  compare:
    name: Gate checkout (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: [whole-first, sparse-first]
    steps:
      - name: Start checkout 1
        run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout 1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a208edc6689e71f8a499f1a97c81e7d10ae5c06e
          path: checkout-1
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.order == 'sparse-first' && format('/.github/{0}/autogpt_platform/backend/poetry.lock', fromJSON('"\n"')) || '' }}
      - name: Measure checkout 1 and verify the complete selector
        env:
          MODE: ${{ matrix.order == 'sparse-first' && 'sparse' || 'whole' }}
        working-directory: checkout-1
        run: |
          elapsed=$(($(date +%s)-BENCHMARK_STARTED))
          echo "::notice title=checkout-comparison::{\"order\":\"${{ matrix.order }}\",\"mode\":\"$MODE\",\"seconds\":$elapsed}"
          git count-objects -v
          if [[ "$MODE" == sparse ]]; then
            test ! -d docs
            test ! -d autogpt_platform/frontend
            test -f autogpt_platform/backend/poetry.lock
          fi
          python3 -m unittest discover -s .github/scripts -p test_ci_affected.py -v
      - name: Start checkout 2
        run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a208edc6689e71f8a499f1a97c81e7d10ae5c06e
          path: checkout-2
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.order == 'whole-first' && format('/.github/{0}/autogpt_platform/backend/poetry.lock', fromJSON('"\n"')) || '' }}
      - name: Measure checkout 2 and verify the complete selector
        env:
          MODE: ${{ matrix.order == 'whole-first' && 'sparse' || 'whole' }}
        working-directory: checkout-2
        run: |
          elapsed=$(($(date +%s)-BENCHMARK_STARTED))
          echo "::notice title=checkout-comparison::{\"order\":\"${{ matrix.order }}\",\"mode\":\"$MODE\",\"seconds\":$elapsed}"
          git count-objects -v
          if [[ "$MODE" == sparse ]]; then
            test ! -d docs
            test ! -d autogpt_platform/frontend
            test -f autogpt_platform/backend/poetry.lock
          fi
          python3 -m unittest discover -s .github/scripts -p test_ci_affected.py -v
