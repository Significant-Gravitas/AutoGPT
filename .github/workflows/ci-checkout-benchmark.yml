name: Validate sparse report gates
on:
  push:
    branches: [codex/ci-checkout-benchmark-20261103-1702]
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Run report and sparse selection contracts
        run: |
          test ! -d autogpt_platform
          test ! -d docs
          python3 -m venv "$RUNNER_TEMP/gate-tests"
          "$RUNNER_TEMP/gate-tests/bin/pip" install PyYAML==6.0.3
          for pattern in test_ci_affected.py test_validate_backend_skips.py test_validate_junit.py test_validate_cobertura.py test_verify_smoke_shards.py; do
            "$RUNNER_TEMP/gate-tests/bin/python" -m unittest discover -s .github/scripts -p "$pattern" -v
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41682459760
          pattern: backend-test-reports-py*
          path: backend-shard-reports
      - name: Verify all 62 real backend reports
        run: python3 .github/scripts/validate_backend_skips.py --allow-skips-from .github/scripts/backend-allowed-skips.json --reports-dir backend-shard-reports --partitioned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41682459760
          pattern: playwright-test-results-smoke-*
          path: smoke-reports
      - name: Verify complete real smoke inventory and shard union
        run: python3 .github/scripts/verify_smoke_shards.py shards smoke-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41682459760
          pattern: frontend-integration-shard-*-of-16
          path: frontend-shard-reports
      - name: Verify all 16 real frontend reports
        run: |
          for shard in $(seq 1 16); do
            report="frontend-shard-reports/frontend-integration-shard-${shard}-of-16"
            python3 .github/scripts/validate_junit.py --require-no-skips "$report/junit.xml"
            python3 .github/scripts/validate_cobertura.py "$report/coverage/cobertura-coverage.xml"
          done
