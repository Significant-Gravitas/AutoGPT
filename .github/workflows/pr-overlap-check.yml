name: PR Overlap Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-overlaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for merge testing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run overlap detection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python .github/scripts/detect_overlaps.py "$PR_NUMBER"
          else
            python .github/scripts/detect_overlaps.py --ref "$TARGET_SHA" --base dev --dry-run --skip-merge-test
          fi
