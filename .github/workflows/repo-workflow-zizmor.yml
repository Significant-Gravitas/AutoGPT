name: Repo - Workflow Lint

# Runs zizmor, a static analyser for GitHub Actions, over our workflows,
# composite actions and Dependabot config. Results go to code scanning, which
# shows a pull request only the findings it adds. Findings we reviewed and
# accept are listed, each with its reason, in .github/zizmor.yml, so the
# report starts clean and anything new stands out.
on:
  push:
    branches: [master, dev]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Online audits (impostor commits, actions with known problems) use the
      # job's token. The zizmor version is pinned so a new release can't
      # start failing pull requests on its own; Dependabot doesn't bump it.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
