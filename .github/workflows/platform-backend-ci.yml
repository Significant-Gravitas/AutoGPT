name: Backend scope contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify environment and hard process-tree deadline
        shell: bash
        run: |
          set -euo pipefail
          sudo --version | head -n 1
          systemd-run --version | head -n 1
          export CI_SCOPE_SENTINEL='space $dollar "quotes"'
          export CI_SCOPE_EMPTY=''
          export CI_SCOPE_MULTILINE=$'first\nsecond'
          export COVERAGE_FILE='.coverage-contract'
          export ENCRYPTION_KEY='contract-sentinel-only'
          python3 .github/scripts/scope_contract.py save "$RUNNER_TEMP/scope-context.json"
          run_scope() {
            local unit="$1" duration="$2"
            shift 2
            preserve_env=$(python -c 'import os; print(",".join(os.environ))')
            set +e
            sudo --preserve-env="$preserve_env" systemd-run --scope --expand-environment=no --unit="$unit" \
              -p RuntimeMaxSec="$duration" -p TimeoutStopSec=15s -p KillMode=control-group \
              /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups \
              /usr/bin/env PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" /usr/bin/time -v \
              "$@"
            local status=$?
            if [[ "$(sudo systemctl show "$unit" --property=LoadState --value)" == loaded ]]; then
              sudo systemctl stop "$unit" || status=1
            fi
            return "$status"
          }
          run_scope ci-env-contract.scope 30s python3 .github/scripts/scope_contract.py verify "$RUNNER_TEMP/scope-context.json"
          status=$?
          set -e
          [[ "$status" == 0 ]]
          run_scope ci-status-contract.scope 30s python3 -c 'raise SystemExit(37)'
          status=$?
          set -e
          [[ "$status" == 37 ]]
          start=$SECONDS
          run_scope ci-kill-contract.scope 2s python3 .github/scripts/scope_contract.py hang "$RUNNER_TEMP/scope-pids.json"
          status=$?
          set -e
          elapsed=$((SECONDS - start))
          result=$(sudo systemctl show ci-kill-contract.scope --property=Result --value)
          sudo systemctl show ci-kill-contract.scope --property=Result,TasksCurrent,MemoryPeak
          [[ "$status" != 0 && "$result" == timeout && "$elapsed" -le 25 ]]
          python3 .github/scripts/scope_contract.py gone "$RUNNER_TEMP/scope-pids.json"
          echo "PASS: exit status preserved; timeout failed after ${elapsed}s"
