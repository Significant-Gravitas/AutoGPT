name: AutoGPT Platform - Backend CI

on:
  push:
    branches: [master, dev, ci-test*]
    paths:
      - ".github/workflows/platform-backend-ci.yml"
      - ".github/workflows/scripts/get_package_version_from_lockfile.py"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - "autogpt_platform/backend/**"
      - "autogpt_platform/autogpt_libs/**"
  pull_request:
    branches: [master, dev, release-*]
    paths:
      - ".github/workflows/platform-backend-ci.yml"
      - ".github/workflows/scripts/get_package_version_from_lockfile.py"
      - ".github/scripts/validate_junit.py"
      - ".github/scripts/test_validate_junit.py"
      - "autogpt_platform/backend/**"
      - "autogpt_platform/autogpt_libs/**"
  merge_group:
  # On-demand run of the full backend test + coverage suite for any branch.
  # Useful when a branch's changes don't match the paths filter above (so the
  # automatic push/pull_request runs are skipped) but you still want to run the
  # suite and produce a fresh coverage upload for that branch's HEAD commit.
  #   gh workflow run platform-backend-ci.yml --ref <branch>
  workflow_dispatch:

concurrency:
  group: ${{ format('backend-ci-{0}', github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('{0}-{1}', github.event_name, github.event.pull_request.number) || github.sha)) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/backend

jobs:
  lint:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('autogpt_platform/backend/poetry.lock') }}

      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          echo "Using Poetry version ${HEAD_POETRY_VERSION}"
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Check poetry.lock
        run: |
          poetry lock

          if ! git diff --quiet --ignore-matching-lines="^# " poetry.lock; then
            echo "Error: poetry.lock not up to date."
            echo
            git diff poetry.lock
            exit 1
          fi

      - name: Install Python dependencies
        run: poetry install

      - name: Run Linters
        run: poetry run lint --skip-pyright

    env:
      CI: true
      PLAIN_OUTPUT: True

  # autogpt_libs is a standalone package with its own env; the backend `test`
  # job (scoped to autogpt_platform/backend) never collects its tests, so run
  # them here. Pure unit tests — no database or external services needed.
  autogpt-libs-test:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/autogpt_libs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-libs-${{ hashFiles('autogpt_platform/autogpt_libs/poetry.lock') }}

      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry ../backend/poetry.lock)
          echo "Using Poetry version ${HEAD_POETRY_VERSION}"
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Install Python dependencies
        run: poetry install

      - name: Run pytest
        run: poetry run pytest -q --junitxml=junit-autogpt-libs.xml

      - name: Validate test report
        if: ${{ always() }}
        run: >-
          python ../../.github/scripts/validate_junit.py --synthesize-invalid
          junit-autogpt-libs.xml

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: autogpt-libs-test-report
          path: autogpt_platform/autogpt_libs/junit-autogpt-libs.xml
          if-no-files-found: error

    env:
      CI: true
      PLAIN_OUTPUT: True

  type-check:
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('autogpt_platform/backend/poetry.lock') }}

      - name: Install Poetry
        run: |
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          echo "Using Poetry version ${HEAD_POETRY_VERSION}"
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$HEAD_POETRY_VERSION python3 -

      - name: Install Python dependencies
        run: poetry install

      - name: Generate Prisma Client
        run: poetry run prisma generate && poetry run gen-prisma-stub

      - name: Run Pyright
        run: poetry run pyright --pythonversion ${{ matrix.python-version }}

    env:
      CI: true
      PLAIN_OUTPUT: True

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.test-shard }})
    permissions:
      contents: read
    # Each Python leg preserves the complete suite while its four disjoint path
    # groups run on separate standard runners. This avoids CPU and service
    # contention without deselecting tests or sharing mutable state between
    # shards. The timeout remains a hang guard, not a performance budget.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        test-shard: [data, copilot, util-executor, remainder]
    runs-on: ubuntu-latest

    services:
      # Redis is provisioned as a real 3-shard cluster below via docker
      # run (see the "Start Redis Cluster" step). GHA services can't
      # override the image CMD or stand up multi-container clusters, so
      # that setup is inlined — it mirrors the topology of the local dev
      # compose stack (autogpt_platform/docker-compose.platform.yml) and
      # prod helm chart.
      rabbitmq:
        image: rabbitmq:4.1.4
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_DEFAULT_PASS }}
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 10s
      clamav:
        image: clamav/clamav-debian:latest
        ports:
          - 3310:3310
        env:
          CLAMAV_NO_FRESHCLAMD: false
          CLAMD_CONF_StreamMaxLength: 50M
          CLAMD_CONF_MaxFileSize: 100M
          CLAMD_CONF_MaxScanSize: 100M
          CLAMD_CONF_MaxThreads: 4
          CLAMD_CONF_ReadTimeout: 300
        options: >-
          --health-cmd "clamdscan --version || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 180s
      # FalkorDB backs the Graphiti knowledge graph the copilot uses for
      # long-term memory. Mirrors the local compose mapping
      # (autogpt_platform/docker-compose.platform.yml: ``6380:6379``) so
      # ``GraphitiConfig`` defaults (``localhost:6380``,
      # password=``local-dev-password`` from backend/.env.default) work
      # unchanged. ``REDIS_ARGS=--requirepass <pw>`` is the FalkorDB
      # image's documented way to set the bearer; mirrors the entrypoint
      # the compose stack writes. Integration tests in
      # ``backend/copilot/graphiti/*_integration_test.py`` skip cleanly
      # via the ``falkordb_available`` fixture when the port isn't open
      # (e.g. on a contributor's laptop) — this service makes the port
      # available in CI so the integration suite actually runs.
      # ``redis-cli`` ships inside the FalkorDB image; the healthcheck
      # passes ``-a`` so AUTH succeeds rather than the daemon rejecting
      # an unauthenticated PING.
      # Pinned to a concrete release (unlike the local compose ``:latest``)
      # so an upstream FalkorDB push can't start failing CI on unrelated
      # PRs; bump deliberately alongside the compose stack.
      falkordb:
        image: falkordb/falkordb:v4.18.9
        ports:
          - 6380:6379
        env:
          REDIS_ARGS: "--requirepass local-dev-password"
        options: >-
          --health-cmd "redis-cli -a local-dev-password ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Full ref history is needed so the "Install Poetry" step below can
          # read poetry.lock off the base branch. `filter: blob:none` keeps
          # every ref reachable while skipping the blob download for all of
          # them, then lazily fetches the one blob that step actually reads.
          # Without it this checkout has been measured at 429s vs 27s for a
          # sibling matrix leg in the same run - enough variance on its own to
          # blow the job budget.
          fetch-depth: 0
          filter: blob:none
          submodules: true

      - name: Configure test shard
        shell: bash
        env:
          MATRIX_TEST_SHARD: ${{ matrix.test-shard }}
        run: |
          case "$MATRIX_TEST_SHARD" in
            data|copilot|remainder)
              database_suffix="$MATRIX_TEST_SHARD"
              ;;
            util-executor)
              database_suffix="util_executor"
              ;;
            *)
              echo "Unknown backend test shard: $MATRIX_TEST_SHARD" >&2
              exit 1
              ;;
          esac

          {
            echo "TEST_SHARD=$MATRIX_TEST_SHARD"
            echo "DATABASE_NAME=ci_${database_suffix}"
            echo "RABBITMQ_VHOST=ci-${MATRIX_TEST_SHARD}"
            echo "REDIS_PORT=17000"
          } >> "$GITHUB_ENV"

      - name: Start isolated stateful services
        id: stateful-services
        working-directory: autogpt_platform
        background: true
        env:
          CLAMAV_CONTAINER: ${{ job.services.clamav.id }}
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            -v "$(pwd)/db/init/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro" \
            pgvector/pgvector:pg15

          postgres_ready=false
          for _ in $(seq 1 30); do
            if docker exec postgres-test pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != "true" ]]; then
            echo "Postgres failed to start" >&2
            docker logs postgres-test >&2
            exit 1
          fi

          docker exec postgres-test createdb -h 127.0.0.1 -U postgres "$DATABASE_NAME"
          docker exec postgres-test psql -h 127.0.0.1 -U postgres \
            -v ON_ERROR_STOP=1 -d "$DATABASE_NAME" \
            -f /docker-entrypoint-initdb.d/00-init.sql

          if [[ -z "$RABBITMQ_CONTAINER" ]]; then
            echo "RabbitMQ service container was not found" >&2
            exit 1
          fi
          docker exec "$RABBITMQ_CONTAINER" rabbitmqctl add_vhost "$RABBITMQ_VHOST"
          docker exec "$RABBITMQ_CONTAINER" rabbitmqctl set_permissions \
            -p "$RABBITMQ_VHOST" "$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"

          start_redis_cluster() {
            local name="$1"
            local base_port="$2"
            local network="redis-cluster-ci-${name}"
            docker network create "$network"

            for offset in 0 1 2; do
              local port=$((base_port + offset))
              local bus=$((base_port + 10000 + offset))
              local container="redis-${name}-${offset}"
              docker run -d --name "$container" --network "$network" \
                --network-alias "$container" \
                -p "$port:$port" \
                redis:7 \
                redis-server --port "$port" \
                  --cluster-enabled yes \
                  --cluster-config-file nodes.conf \
                  --cluster-node-timeout 5000 \
                  --cluster-require-full-coverage no \
                  --cluster-announce-hostname "$container" \
                  --cluster-announce-port "$port" \
                  --cluster-announce-bus-port "$bus" \
                  --cluster-preferred-endpoint-type hostname
            done

            for offset in 0 1 2; do
              local port=$((base_port + offset))
              local container="redis-${name}-${offset}"
              local ready=false
              for _ in $(seq 1 30); do
                if docker exec "$container" redis-cli -p "$port" ping 2>/dev/null | grep -q '^PONG$'; then
                  ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$ready" != "true" ]]; then
                echo "$container failed to accept commands" >&2
                docker logs "$container" >&2
                return 1
              fi
            done

            docker run --rm --network "$network" redis:7 \
              redis-cli --cluster create \
                "redis-${name}-0:${base_port}" \
                "redis-${name}-1:$((base_port + 1))" \
                "redis-${name}-2:$((base_port + 2))" \
                --cluster-replicas 0 --cluster-yes

            for _ in $(seq 1 30); do
              local info
              if info=$(docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info); then
                local state
                state=$(printf '%s\n' "$info" | awk -F: '/^cluster_state:/ {print $2}' | tr -d '[:cntrl:]')
                if [[ "$state" == "ok" ]]; then
                  echo "Redis cluster ${name} ready on ${base_port}-$((base_port + 2))"
                  return 0
                fi
              fi
              sleep 1
            done

            echo "Redis cluster ${name} failed to converge" >&2
            docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info >&2
            return 1
          }

          start_redis_cluster "$TEST_SHARD" "$REDIS_PORT"

          if [[ -z "$CLAMAV_CONTAINER" ]]; then
            echo "ClamAV service container was not found" >&2
            exit 1
          fi
          clamav_ready=false
          for _ in $(seq 1 60); do
            if nc -z localhost 3310; then
              clamav_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$clamav_ready" != "true" ]]; then
            echo "ClamAV failed to start" >&2
            docker logs "$CLAMAV_CONTAINER" >&2
            exit 1
          fi
          if ! timeout 10 bash -c 'echo "PING" | nc localhost 3310'; then
            echo "ClamAV is not responding to PING" >&2
            docker logs "$CLAMAV_CONTAINER" >&2
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('autogpt_platform/backend/poetry.lock') }}

      - name: Install Poetry
        run: |
          # Extract Poetry version from backend/poetry.lock
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          echo "Found Poetry version ${HEAD_POETRY_VERSION} in backend/poetry.lock"

          if [ -n "$BASE_REF" ]; then
            BASE_BRANCH=${BASE_REF/refs\/heads\//}
            if ! BASE_LOCK=$(git show "origin/$BASE_BRANCH":./poetry.lock); then
              echo "Could not read poetry.lock from ${BASE_REF}" >&2
              exit 1
            fi
            BASE_POETRY_VERSION=$(printf '%s\n' "$BASE_LOCK" | python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry -)
            echo "Found Poetry version ${BASE_POETRY_VERSION} in backend/poetry.lock on ${BASE_REF}"
            POETRY_VERSION=$(printf '%s\n' "$HEAD_POETRY_VERSION" "$BASE_POETRY_VERSION" | sort -V | tail -n1)
          else
            POETRY_VERSION=$HEAD_POETRY_VERSION
          fi
          echo "Using Poetry version ${POETRY_VERSION}"

          # Install Poetry
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$POETRY_VERSION python3 -

          if [ "${{ runner.os }}" = "macOS" ]; then
            PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}

      - name: Install Python dependencies
        run: poetry install

      - name: Generate Prisma Client
        run: poetry run prisma generate && poetry run gen-prisma-stub

      - name: Wait for isolated stateful services
        wait: stateful-services

      - name: Migrate shard database
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${DATABASE_NAME}"
          export DIRECT_URL="$DATABASE_URL"
          poetry run prisma migrate deploy

      - name: Test shard
        shell: bash
        env:
          COVERAGE_FILE: .coverage-${{ matrix.test-shard }}
          LOG_LEVEL: ${{ runner.debug && 'DEBUG' || 'INFO' }}
          EXECUTION_MANAGER_PORT: "18002"
          DATABASE_API_PORT: "18005"
          AGENT_API_PORT: "18006"
          EXECUTION_SCHEDULER_PORT: "18003"
          NOTIFICATION_SERVICE_PORT: "18007"
          JWT_VERIFY_KEY: "ci-only-jwt-verify-key-with-at-least-32-characters"
          REDIS_HOST: localhost
          ENCRYPTION_KEY: "dvziYgz0KSK8FENhju0ZYi8-fRTfAdlz6YLhdB_jhNw="
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${DATABASE_NAME}"
          export DIRECT_URL="$DATABASE_URL"
          pytest_args=(
            -p no:cacheprovider
            --cov=backend
            --cov-branch
            --cov-report=
            --cov-report="xml:coverage-${TEST_SHARD}.xml"
            --junitxml="junit-${TEST_SHARD}.xml"
          )
          if [[ "${{ runner.debug }}" == "1" ]]; then
            pytest_args+=(-s -vv -o log_cli=true -o log_cli_level=DEBUG)
          else
            pytest_args+=(-q)
          fi

          case "$TEST_SHARD" in
            data)
              test_paths=(backend/data)
              export E2E_REDIS_CLUSTER_RESTART=1
              ;;
            copilot)
              test_paths=(backend/copilot)
              ;;
            util-executor)
              test_paths=(backend/util backend/executor)
              ;;
            remainder)
              test_paths=()
              for path in backend/*/; do
                case "$path" in
                  backend/data/|backend/copilot/|backend/util/|backend/executor/)
                    continue
                    ;;
                esac
                test_paths+=("${path%/}")
              done
              test_paths+=(
                scripts
                test
                ../../.github/scripts/test_validate_junit.py
              )
              ;;
            *)
              echo "Unknown backend test shard: $TEST_SHARD" >&2
              exit 1
              ;;
          esac

          if (( ${#test_paths[@]} == 0 )); then
            echo "Backend test shard $TEST_SHARD selected no paths" >&2
            exit 1
          fi
          poetry run pytest "${pytest_args[@]}" "${test_paths[@]}"

      - name: Validate test reports
        if: ${{ always() }}
        run: >-
          python ../../.github/scripts/validate_junit.py --synthesize-invalid
          junit-${{ matrix.test-shard }}.xml

      - name: Validate coverage reports
        if: ${{ always() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("coverage-${{ matrix.test-shard }}.xml")
          if not report.is_file() or not report.stat().st_size:
              raise SystemExit(f"Missing or empty report: {report}")
          ElementTree.parse(report)
          print(f"Validated nonempty XML report: {report}")
          PY

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-py${{ matrix.python-version }}-${{ matrix.test-shard }}
          path: |
            autogpt_platform/backend/junit-${{ matrix.test-shard }}.xml
            autogpt_platform/backend/coverage-${{ matrix.test-shard }}.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: platform-backend
          files: ./autogpt_platform/backend/coverage-${{ matrix.test-shard }}.xml

    env:
      CI: true
      PLAIN_OUTPUT: True
      RUN_ENV: local
      PORT: 8080
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # We know these are here, don't report this as a security vulnerability
      # This is used as the default credential for the entire system's RabbitMQ instance
      # If you want to replace this, you can do so by making our entire system generate
      # new credentials for each local user and update the environment variables in
      # the backend service, docker composes, and examples
      RABBITMQ_DEFAULT_USER: "rabbitmq_user_default"
      RABBITMQ_DEFAULT_PASS: "k0VMxyIJF9S35f3x2uaw5IWAl6Y536O7"
