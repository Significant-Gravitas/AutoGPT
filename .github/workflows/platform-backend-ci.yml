name: Backend Python import diagnostic
run-name: Python startup profile

on:
  push:
    branches: [codex/ci-prisma-preload-20261103-1710]
  workflow_dispatch:
    inputs:
      test_layout:
        type: choice
        options: [paths]
        default: paths

permissions:
  contents: read

concurrency:
  group: python-import-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/backend

jobs:
  test:
    name: Prisma preload (${{ matrix.python-version }}, ${{ matrix.order }})
    permissions:
      contents: read
    # Each Python leg splits the eight fixture groups into 31 whole-file
    # partitions on standard runners. The cap is a hang guard, not a
    # performance budget: on merge_group a cancelled job reads as a failed
    # check and ejects the PR from the queue, so keep it well above p99.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        order: [baseline-first, candidate-first]
        partition: [3]
        test-shard: [billing-threads]
    runs-on: ubuntu-latest

    services:
      # Redis is provisioned as a real 3-shard cluster below via docker
      # run (see the "Start Redis Cluster" step). GHA services can't
      # override the image CMD or stand up multi-container clusters, so
      # that setup is inlined — it mirrors the topology of the local dev
      # compose stack (autogpt_platform/docker-compose.platform.yml) and
      # prod helm chart.
      rabbitmq:
        image: rabbitmq:4.1.4
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_DEFAULT_PASS }}
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 10s
      clamav:
        image: clamav/clamav-debian:latest
        ports:
          - 3310:3310
        env:
          CLAMAV_NO_FRESHCLAMD: false
          CLAMD_CONF_StreamMaxLength: 50M
          CLAMD_CONF_MaxFileSize: 100M
          CLAMD_CONF_MaxScanSize: 100M
          CLAMD_CONF_MaxThreads: 4
          CLAMD_CONF_ReadTimeout: 300
        options: >-
          --health-cmd "clamdscan --version || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 180s
      # FalkorDB backs the Graphiti knowledge graph the copilot uses for
      # long-term memory. Mirrors the local compose mapping
      # (autogpt_platform/docker-compose.platform.yml: ``6380:6379``) so
      # the default Graphiti port is available on the runner. The
      # password is derived from the run, like the broker login below, and
      # the job's ``GRAPHITI_FALKORDB_PASSWORD`` gives the tests the same one.
      # ``REDIS_ARGS=--requirepass <pw>`` is the FalkorDB
      # image's documented way to set the bearer; mirrors the entrypoint
      # the compose stack writes. Integration tests in
      # ``backend/copilot/graphiti/*_integration_test.py`` skip cleanly
      # via the ``falkordb_available`` fixture when the port isn't open
      # (e.g. on a contributor's laptop) — this service makes the port
      # available in CI so the integration suite actually runs.
      # ``redis-cli`` ships inside the FalkorDB image; the healthcheck
      # passes ``-a`` so AUTH succeeds rather than the daemon rejecting
      # an unauthenticated PING.
      # Pinned to the release the cloud runs (``serviceVersion`` in the infra
      # repo's FalkorDB chart): older releases refuse Cypher newer ones run.
      # Bump every FalkorDB pin together with that chart (OPEN-3746, #16224).
      falkordb:
        image: falkordb/falkordb:v4.12.5
        ports:
          - 6380:6379
        env:
          REDIS_ARGS: "--requirepass ci-${{ github.run_id }}-${{ github.run_attempt }}"
        options: >-
          --health-cmd "redis-cli -a ci-${{ github.run_id }}-${{ github.run_attempt }} ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          # Full ref history is needed so the "Install Poetry" step below can
          # read poetry.lock off the base branch. `filter: blob:none` keeps
          # every ref reachable while skipping the blob download for all of
          # them, then lazily fetches the one blob that step actually reads.
          # Without it this checkout has been measured at 429s vs 27s for a
          # sibling matrix leg in the same run - enough variance on its own to
          # blow the job budget.
          fetch-depth: 0
          filter: blob:none
          submodules: true

      - name: Checkout skills catalog
        # The expert roster and the marketplace skills live in a separate
        # repo. The shards read it from SKILLS_CATALOG_PATH so no test
        # resolves `main` through the GitHub API: runners share one
        # unauthenticated rate limit and hit 403s under load.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Significant-Gravitas/skills-catalog
          # Update the roster-content assertions alongside this catalog snapshot.
          ref: 7ed3b73314d5186120e8d4006febfd7e1c92cf08
          path: skills-catalog

      - name: Configure test shard
        shell: bash
        env:
          MATRIX_TEST_SHARD: ${{ matrix.test-shard }}
          MATRIX_TEST_PARTITION: ${{ matrix.partition }}
        run: |
          # The trial tests' safety guard only accepts localhost:5432/postgres
          # under GITHUB_ACTIONS, and the per-shard names are cosmetic anyway —
          # each shard already has its own runner and its own Postgres container.
          case "$MATRIX_TEST_SHARD" in
            data)
              database_name="postgres"
              ;;
            copilot|memory-experts|sdk-billing|billing-threads|util-executor|api|remainder)
              database_name="ci_${MATRIX_TEST_SHARD//-/_}"
              ;;
            *)
              echo "Unknown backend test shard: $MATRIX_TEST_SHARD" >&2
              exit 1
              ;;
          esac

          {
            echo "TEST_SHARD=${MATRIX_TEST_SHARD}-${MATRIX_TEST_PARTITION}"
            echo "DATABASE_NAME=${database_name}"
            echo "RABBITMQ_VHOST=ci-${MATRIX_TEST_SHARD}"
            echo "REDIS_PORT=17000"
          } >> "$GITHUB_ENV"

      - name: Start isolated stateful services
        id: stateful-services
        working-directory: autogpt_platform
        background: true
        env:
          CLAMAV_CONTAINER: ${{ job.services.clamav.id }}
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          postgres_image=pgvector/pgvector:pg15
          bash "$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh" "$postgres_image"
          docker run --pull=never -d --name postgres-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            -v "$(pwd)/db/init/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro" \
            "$postgres_image"

          postgres_ready=false
          for _ in $(seq 1 30); do
            if docker exec postgres-test pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != "true" ]]; then
            echo "Postgres failed to start" >&2
            docker logs postgres-test >&2
            exit 1
          fi

          # The container's entrypoint already created and initialised `postgres`.
          if [[ "$DATABASE_NAME" != "postgres" ]]; then
            docker exec postgres-test createdb -h 127.0.0.1 -U postgres "$DATABASE_NAME"
            docker exec postgres-test psql -h 127.0.0.1 -U postgres \
              -v ON_ERROR_STOP=1 -d "$DATABASE_NAME" \
              -f /docker-entrypoint-initdb.d/00-init.sql
          fi

          if [[ -z "$RABBITMQ_CONTAINER" ]]; then
            echo "RabbitMQ service container was not found" >&2
            exit 1
          fi
          docker exec "$RABBITMQ_CONTAINER" rabbitmqctl add_vhost "$RABBITMQ_VHOST"
          docker exec "$RABBITMQ_CONTAINER" rabbitmqctl set_permissions \
            -p "$RABBITMQ_VHOST" "$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"

          start_redis_cluster() {
            local name="$1"
            local base_port="$2"
            local network="redis-cluster-ci-${name}"
            docker network create "$network"

            for offset in 0 1 2; do
              local port=$((base_port + offset))
              local bus=$((base_port + 10000 + offset))
              local container="redis-${name}-${offset}"
              docker run --pull=never -d --name "$container" --network "$network" \
                --network-alias "$container" \
                -p "$port:$port" \
                "$redis_image" \
                redis-server --port "$port" \
                  --cluster-enabled yes \
                  --cluster-config-file nodes.conf \
                  --cluster-node-timeout 5000 \
                  --cluster-require-full-coverage no \
                  --cluster-announce-hostname "$container" \
                  --cluster-announce-port "$port" \
                  --cluster-announce-bus-port "$bus" \
                  --cluster-preferred-endpoint-type hostname
            done

            for offset in 0 1 2; do
              local port=$((base_port + offset))
              local container="redis-${name}-${offset}"
              local ready=false
              for _ in $(seq 1 30); do
                if docker exec "$container" redis-cli -p "$port" ping 2>/dev/null | grep -q '^PONG$'; then
                  ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$ready" != "true" ]]; then
                echo "$container failed to accept commands" >&2
                docker logs "$container" >&2
                return 1
              fi
            done

            docker run --pull=never --rm --network "$network" "$redis_image" \
              redis-cli --cluster create \
                "redis-${name}-0:${base_port}" \
                "redis-${name}-1:$((base_port + 1))" \
                "redis-${name}-2:$((base_port + 2))" \
                --cluster-replicas 0 --cluster-yes

            for _ in $(seq 1 30); do
              local info
              if info=$(docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info); then
                local state
                state=$(printf '%s\n' "$info" | awk -F: '/^cluster_state:/ {print $2}' | tr -d '[:cntrl:]')
                if [[ "$state" == "ok" ]]; then
                  echo "Redis cluster ${name} ready on ${base_port}-$((base_port + 2))"
                  return 0
                fi
              fi
              sleep 1
            done

            echo "Redis cluster ${name} failed to converge" >&2
            docker exec "redis-${name}-0" redis-cli -p "$base_port" cluster info >&2
            return 1
          }

          redis_image=redis:7
          bash "$GITHUB_WORKSPACE/.github/scripts/docker-pull-with-retry.sh" "$redis_image"
          start_redis_cluster "$TEST_SHARD" "$REDIS_PORT"

          if [[ -z "$CLAMAV_CONTAINER" ]]; then
            echo "ClamAV service container was not found" >&2
            exit 1
          fi
          clamav_ready=false
          for _ in $(seq 1 60); do
            if nc -z localhost 3310; then
              clamav_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$clamav_ready" != "true" ]]; then
            echo "ClamAV failed to start" >&2
            docker logs "$CLAMAV_CONTAINER" >&2
            exit 1
          fi
          if ! timeout 10 bash -c 'echo "PING" | nc localhost 3310'; then
            echo "ClamAV is not responding to PING" >&2
            docker logs "$CLAMAV_CONTAINER" >&2
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python dependency cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('autogpt_platform/backend/poetry.lock') }}

      - name: Install Poetry
        run: |
          # Extract Poetry version from backend/poetry.lock
          HEAD_POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          echo "Found Poetry version ${HEAD_POETRY_VERSION} in backend/poetry.lock"

          if [ -n "$BASE_REF" ]; then
            BASE_BRANCH=${BASE_REF/refs\/heads\//}
            if ! BASE_LOCK=$(git show "origin/$BASE_BRANCH":./poetry.lock); then
              echo "Could not read poetry.lock from ${BASE_REF}" >&2
              exit 1
            fi
            BASE_POETRY_VERSION=$(printf '%s\n' "$BASE_LOCK" | python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry -)
            echo "Found Poetry version ${BASE_POETRY_VERSION} in backend/poetry.lock on ${BASE_REF}"
            POETRY_VERSION=$(printf '%s\n' "$HEAD_POETRY_VERSION" "$BASE_POETRY_VERSION" | sort -V | tail -n1)
          else
            POETRY_VERSION=$HEAD_POETRY_VERSION
          fi
          echo "Using Poetry version ${POETRY_VERSION}"

          # Install Poetry
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$POETRY_VERSION python3 -

          if [ "${{ runner.os }}" = "macOS" ]; then
            PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}

      - name: Install Python dependencies
        run: poetry install

      - name: Generate Prisma Client
        run: poetry run prisma generate && poetry run gen-prisma-stub

      - name: Wait for isolated stateful services
        wait: stateful-services

      - name: Migrate shard database
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${DATABASE_NAME}"
          export DIRECT_URL="$DATABASE_URL"
          poetry run prisma migrate deploy

      - name: Generate ephemeral secrets
        # A fixed value here would be a published value. These live only for
        # the duration of this job.
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          echo "UNSUBSCRIBE_SECRET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          echo "INTERNAL_API_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Compare complete partition with and without Prisma preloading
        run: poetry run python ../../.github/scripts/benchmark_prisma_preload.py --order '${{ matrix.order }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: prisma-preload-${{ matrix.python-version }}-${{ matrix.order }}
          path: ${{ runner.temp }}/prisma-preload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
