name: Next route type equivalence

on:
  push:
    branches: [codex/ci-next-route-types-20261119]

permissions:
  contents: read

concurrency:
  group: next-route-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-types:
    name: Next route types (${{ matrix.first }} first)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        first: [tsc, bun]
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: autogpt_platform/frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: autogpt_platform/frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies and generate the API client
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm generate:api
      - name: Compare generated route checks and reject an invalid page signature
        run: >-
          python3 ../../.github/ci-diagnostics/benchmark_next_route_types.py
          --first "${{ matrix.first }}"
          --output "$RUNNER_TEMP/next-route-types-report"
      - name: Upload timings and positive and negative checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-route-types-${{ matrix.first }}-first
          path: ${{ runner.temp }}/next-route-types-report
          if-no-files-found: error
