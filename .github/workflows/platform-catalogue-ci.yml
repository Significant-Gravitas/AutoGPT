name: AutoGPT Platform - Catalogue safety

on:
  pull_request:
    branches: [dev, master]
    paths:
      - "autogpt_platform/backend/**"
      - ".github/workflows/platform-catalogue-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: autogpt_platform/backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry==2.2.1
      - run: poetry install --no-interaction
      - name: Start a disposable local PostgreSQL instance
        run: |
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          export POSTGRES_PASSWORD="$PASSWORD"
          docker run -d --name catalogue-postgres -p 127.0.0.1:55439:5432 \
            -e POSTGRES_PASSWORD -e POSTGRES_DB=catalogue_release_ci \
            pgvector/pgvector:0.8.6-pg16
          for attempt in $(seq 1 30); do
            if docker exec catalogue-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          URL="postgresql://postgres:${PASSWORD}@127.0.0.1:55439/catalogue_release_ci?schema=platform"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$URL" >> "$GITHUB_ENV"
          echo "CATALOGUE_TEST_DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Apply the exact migration and generate the client
        run: |
          poetry run python scripts/prepare_catalogue_test_database.py
          poetry run prisma generate
      - name: Test ownership, full packages, retries, failure, concurrency and rollback
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          poetry run pytest --noconftest -p pytest_asyncio.plugin -p pytest_mock.plugin \
            backend/api/features/store/skill_seed_test.py \
            backend/api/features/store/catalog_release_model_test.py \
            backend/api/features/store/catalog_release_load_test.py \
            backend/api/features/experts/hire_skill_snapshot_test.py \
            backend/api/features/store/skill_install_pinning_test.py \
            backend/copilot/tools/skill_exact_package_test.py \
            backend/api/features/experts/catalogue_templates_test.py \
            backend/api/features/experts/hire_skill_snapshot_integration_test.py \
            backend/api/features/store/catalog_release_integration_test.py \
            -q --junitxml=catalogue-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("catalogue-tests.xml").getroot()
          assert not root.findall(".//skipped"), "Catalogue safety tests must not be skipped"
          PY
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-safety-results
          path: autogpt_platform/backend/catalogue-tests.xml
      - name: Stop the disposable test instance
        if: always()
        run: docker rm -f catalogue-postgres || true
