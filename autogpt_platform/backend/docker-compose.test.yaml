networks:
  app-network:
    name: app-network
  shared-network:
    name: shared-network

volumes:
  supabase-config:
  clamav-data:

x-agpt-services:
  &agpt-services
  networks:
    - app-network
    - shared-network

x-supabase-services:
  &supabase-services
  networks:
    - app-network
    - shared-network

services:
   
  db:
    <<: *supabase-services
    extends:
      file: ../db/docker/docker-compose.yml
      service: db
    ports:
      - ${POSTGRES_PORT}:5432 # We don't use Supavisor locally, so we expose the db directly.

  vector:
    <<: *supabase-services
    extends:
      file: ../db/docker/docker-compose.yml
      service: vector

  # The backend's Redis client is cluster-only (`RedisClient = RedisCluster`),
  # and every other environment — `backend/.env.default`, the dev
  # `docker-compose.yml` and backend CI — serves a 3-shard cluster on
  # 17000/17001/17002. Reuse the dev stack's shards rather than a single-node
  # `redis:latest` on 6379: no supported client can talk to that, and no
  # config in the repo points at it.
  redis-0:
    <<: *agpt-services
    extends:
      file: ../docker-compose.platform.yml
      service: redis-0

  redis-1:
    <<: *agpt-services
    extends:
      file: ../docker-compose.platform.yml
      service: redis-1

  redis-2:
    <<: *agpt-services
    extends:
      file: ../docker-compose.platform.yml
      service: redis-2

  # `extends` deliberately drops `depends_on`, so the shard ordering the dev
  # stack relies on has to be restated here.
  redis-init:
    <<: *agpt-services
    extends:
      file: ../docker-compose.platform.yml
      service: redis-init
    depends_on:
      - redis-0
      - redis-1
      - redis-2

  rabbitmq:
    <<: *agpt-services
    image: rabbitmq:4.1.4-management
    container_name: rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      - RABBITMQ_DEFAULT_USER=rabbitmq_user_default
      - RABBITMQ_DEFAULT_PASS=k0VMxyIJF9S35f3x2uaw5IWAl6Y536O7
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # Management UI
  clamav:
    image: clamav/clamav-debian:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMD_CONF_StreamMaxLength=50M
      - CLAMD_CONF_MaxFileSize=100M
      - CLAMD_CONF_MaxScanSize=100M
      - CLAMD_CONF_MaxThreads=12
      - CLAMD_CONF_ReadTimeout=300
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
