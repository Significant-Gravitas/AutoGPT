command=/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 /opt/autogpt/single-container/run-service.sh valkey-1
user=autogpt-valkey
