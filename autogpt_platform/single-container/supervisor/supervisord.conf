stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:valkey-2]
command=/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 /opt/autogpt/single-container/run-service.sh valkey-2
user=autogpt-valkey
priority=10
startsecs=3
