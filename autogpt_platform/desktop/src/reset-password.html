<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Reset owner password</title>
    <style>
      :root { color-scheme: light dark; --fg: #18181b; --muted: #71717a; --bg: #ffffff; --accent: #7c3aed; --error: #dc2626; }
      @media (prefers-color-scheme: dark) { :root { --fg: #fafafa; --muted: #a1a1aa; --bg: #18181b; --error: #f87171; } }
      body { margin: 0; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 24px 40px;
             font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 16px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
      input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; padding: 6px 10px; border-radius: 6px;
              border: 1px solid var(--muted); background: transparent; color: var(--fg); }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      #message { color: var(--error); min-height: 1.5em; margin-bottom: 8px; }
      #actions { display: flex; gap: 8px; justify-content: flex-end; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
      button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <h1>Reset owner password</h1>
    <p>Sets a new password for this computer's owner account and signs it out everywhere within five minutes. AutoGPT restarts to apply it.</p>
    <form id="form">
      <label>New password (at least 12 characters)
        <input id="password" type="password" autocomplete="new-password" autofocus required />
      </label>
      <label>New password, again
        <input id="confirmation" type="password" autocomplete="new-password" required />
      </label>
      <div id="message" role="alert"></div>
      <div id="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="submit" type="submit">Reset and restart</button>
      </div>
    </form>
    <script src="reset-password.js"></script>
  </body>
</html>
