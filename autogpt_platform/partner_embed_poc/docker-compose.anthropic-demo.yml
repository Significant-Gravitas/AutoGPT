services:
  rest_server: &direct-anthropic
    environment:
      CHAT_USE_CLAUDE_AGENT_SDK: "true"
      CHAT_USE_CLAUDE_CODE_SUBSCRIPTION: "false"
      CHAT_USE_OPENROUTER: "false"
      ANTHROPIC_API_KEY: ${PARTNER_ANTHROPIC_API_KEY:?Set PARTNER_ANTHROPIC_API_KEY}
      CHAT_DIRECT_ANTHROPIC_API_KEY: ${PARTNER_ANTHROPIC_API_KEY:?Set PARTNER_ANTHROPIC_API_KEY}
      CHAT_DAILY_COST_LIMIT_MICRODOLLARS: ${PARTNER_DEMO_DAILY_COST_LIMIT_MICRODOLLARS:-1000000}
      CHAT_WEEKLY_COST_LIMIT_MICRODOLLARS: ${PARTNER_DEMO_WEEKLY_COST_LIMIT_MICRODOLLARS:-5000000}

  copilot_executor:
    <<: *direct-anthropic
