services:
  rest_server:
    environment:
      CHAT_TEST_MODE: "true"

  copilot_executor:
    environment:
      CHAT_TEST_MODE: "true"

  frontend:
    environment:
      PARTNER_EMBED_ID: forwarding-digital
      PARTNER_EMBED_ISSUER: http://localhost:8787
      PARTNER_EMBED_JWKS_URL: http://mock-forwarding-digital:8787/.well-known/jwks.json
      PARTNER_EMBED_AUDIENCE: autogpt-partner-exchange

  mock-forwarding-digital:
    build:
      context: ./partner_embed_poc
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_started
      rest_server:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      PARTNER_ORIGIN: http://localhost:8787
      AUTOGPT_FRONTEND_URL: http://frontend:3000
      AUTOGPT_BACKEND_URL: http://rest_server:8006
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - app-network
