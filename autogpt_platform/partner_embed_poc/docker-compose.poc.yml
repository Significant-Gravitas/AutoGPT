services:
  rest_server:
    environment:
      CHAT_TEST_MODE: "true"

  copilot_executor:
    environment:
      CHAT_TEST_MODE: "true"

  frontend:
    environment:
      PARTNER_EMBED_CONFIGS: >-
        [{"partnerID":"forwarding-digital","issuer":"http://localhost:8787","jwksURL":"http://mock-forwarding-digital:8787/.well-known/jwks.json","audience":"autogpt-partner-exchange"},{"partnerID":"forwarding-digital","issuer":"http://localhost:8788","jwksURL":"http://mock-forwarding-digital-multitenant:8788/.well-known/jwks.json","audience":"autogpt-partner-exchange"}]

  mock-forwarding-digital:
    build:
      context: ./partner_embed_poc
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_started
      rest_server:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      PARTNER_ORIGIN: http://localhost:8787
      AUTOGPT_FRONTEND_URL: http://frontend:3000
      AUTOGPT_BACKEND_URL: http://rest_server:8006
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - app-network

  mock-forwarding-digital-multitenant:
    build:
      context: ./partner_embed_poc
      dockerfile: Dockerfile
    command:
      - pnpm
      - --filter
      - "@autogpt/mock-forwarding-digital-multitenant"
      - start
    depends_on:
      frontend:
        condition: service_started
      rest_server:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      PARTNER_ORIGIN: http://localhost:8788
      AUTOGPT_FRONTEND_URL: http://frontend:3000
      AUTOGPT_BACKEND_URL: http://rest_server:8006
      DATABASE_PATH: /data/forwarding-digital.sqlite
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - forwarding-digital-multitenant-data:/data
    networks:
      - app-network

volumes:
  forwarding-digital-multitenant-data:
