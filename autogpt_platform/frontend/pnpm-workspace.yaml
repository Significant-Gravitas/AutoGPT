onlyBuiltDependencies:
  - "@vercel/speed-insights"
  - esbuild
  - msw

# Better Auth's 2026-11-03 security release
# (https://better-auth.com/blog/security-release-2026-11-03) is newer than the
# 7-day minimum-release-age in .npmrc. Remove these entries after 2026-11-10.
minimumReleaseAgeExclude:
  - better-auth@1.7.16
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-call@1.4.5

# pnpm refuses a version published with weaker trust evidence (provenance or a
# trusted publisher) than any version of the same package published before it,
# by date and across major lines. It checks when it resolves: pnpm add/update,
# Dependabot's runs (a failure shows in the Dependabot job log, not as a PR) and
# the "Check dependency trust policy" step in frontend CI. Exclude a version only
# after checking why it lost that evidence, and remove its entry once that
# version has left pnpm-lock.yaml.
# A downgrade reported locally for a package that npm shows as built by a trusted
# publisher can come from metadata cached by an older pnpm: delete the
# metadata-ff-v1.3 folder in pnpm's cache folder and try again.
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
