onlyBuiltDependencies:
  - "@vercel/speed-insights"
  - esbuild
  - msw

# Better Auth's 2026-11-03 security release
# (https://better-auth.com/blog/security-release-2026-11-03) is newer than the
# 7-day minimum-release-age in .npmrc. Remove these entries after 2026-11-10.
minimumReleaseAgeExclude:
  - better-auth@1.7.16
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-call@1.4.5

# pnpm refuses a version published with weaker trust evidence (provenance or a
# trusted publisher) than an earlier version of the same package. It checks
# versions as it resolves them (pnpm add/update, Dependabot), not on
# --frozen-lockfile installs. Exclude a version only after checking why it lost
# that evidence; the entries below were published that way and are in the lockfile.
# A downgrade reported for a package that npm shows as trusted-publisher-built can
# come from a metadata cache written by an older pnpm: delete the
# metadata-ff-v1.3 folder in pnpm's cache (~/Library/Caches/pnpm on macOS,
# ~/.cache/pnpm on Linux) and try again.
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
